function dialogPage(){const s=DATA.dialogs.find(s=>s.id===ui.dialog);if(!s)return dialogsPage();const step=clamp(ui.dialogStep,0,s.moments.length-1),m=s.moments[step],pick=ui.dialogPick;return `${intro('Диалоги',E(s.title),E(s.scenario),button('← Все сценарии','navigate',{attr:'data-to="dialogs"'}))}<div class="question-shell"><div class="card"><div class="row between"><span class="pill">Шаг ${step+1} из ${s.moments.length}</span><span class="card-emoji" style="margin:0">${E(s.emoji)}</span></div><h3 class="mt16">${E(m.context)}</h3><p class="muted mt8">${E(m.question)}</p><div class="mt16">${m.options.map((o,i)=>`<button class="story-choice" data-action="dialog-choice" data-index="${i}" aria-pressed="${pick===i}">${E(o.text)}</button>`).join('')}</div>${Number.isInteger(pick)&&m.options[pick]?`<div class="story-feedback"><strong>Возможная перспектива</strong><p>${E(m.options[pick].perspective)}</p><strong style="display:block;margin-top:10px">Что попробовать</strong><p>${E(m.options[pick].next)}</p></div>`:''}<div class="btn-row mt20"><button class="btn" data-action="dialog-prev" ${step===0?'disabled':''}>← Предыдущий</button><button class="btn btn-primary" data-action="dialog-next">${step===2?'Завершить':'Следующий шаг →'}</button></div></div></div>`}
function supportPage(){return `${intro('Когда нужна помощь','Поддержка и безопасность','Приложение не заменяет близких людей, профессиональную помощь или экстренные службы.') }<div class="grid2"><div class="card"><div class="card-emoji">♡</div><h2>Когда тяжело</h2><p class="muted mt12">Можно обратиться к человеку, которому доверяешь, или к специалисту. Для этого необязательно иметь «высокий балл» теста.</p><div class="divider"></div><h3>Небольшой доступный шаг</h3><p class="muted mt8">Напиши человеку коротко: «Мне сейчас непросто. Можешь немного побыть рядом или поговорить?»</p></div><div class="card"><div class="card-emoji">✧</div><h2>Если есть непосредственная опасность</h2><p class="muted mt12">Перейди в безопасное место и обратись в местные экстренные службы или к человеку рядом. Не полагайся на подсказки приложения в экстренной ситуации.</p><div class="callout warn mt16">Телефон экстренной помощи зависит от страны. Если ты в ЕС, действует 112; в других местах уточни местный номер.</div></div></div><div class="card mt16"><h3>Важно о результатах тестов</h3><p class="muted mt8">Тесты 40–500 и большинство тематических блоков разработаны для самонаблюдения и не прошли клиническую валидацию. PHQ-4 — отдельный краткий скрининг, его результат не является диагнозом. Если состояние мешает жить, обратись за помощью независимо от результата.</p></div>`}
function settingsPage(){const protectedMode=session==='vault';return `${intro('Контроль и приватность','Настройки','Твои данные, оформление и резервные копии — под твоим контролем.') }<div class="grid2"><div class="card"><h3>Внешний вид</h3><div class="btn-row mt16"><button class="btn ${state.prefs.theme==='dark'?'btn-primary':''}" data-action="set-theme" data-mode="dark">☾ Тёмная</button><button class="btn ${state.prefs.theme==='light'?'btn-primary':''}" data-action="set-theme" data-mode="light">☀ Светлая</button></div><div class="divider"></div><label class="row"><input type="checkbox" id="auto-next-setting" ${state.prefs.autoNext?'checked':''}> Автоматически открывать следующий вопрос после выбора ответа</label></div><div class="card"><h3>${protectedMode?'🔐 Защищённое хранилище':'Демонстрационный режим'}</h3><p class="muted mt12">${protectedMode?'Данные шифруются AES-GCM с ключом, полученным из пароля через PBKDF2. Пароль не хранится.':'Данные этого сеанса не сохраняются после закрытия страницы. Их можно перенести в защищённое хранилище, пока страница открыта.'}</p><div class="column gap12 mt16">${protectedMode?`${button('Скачать зашифрованную копию','export',{primary:true})}${button('Заблокировать приложение','lock')}`:`${hasCrypto()?button('🔒 Включить хранение с паролем','setup',{primary:true}):'<p class="muted">Защищённое хранилище здесь недоступно.</p>'}`}${button('Восстановить копию','import')}</div></div><div class="card"><h3>Что хранится</h3><ul class="list-clean mt12"><li>Ответы: <strong>${totalAnswers()}</strong></li><li>Отметки чувств: <strong>${Object.keys(state.feelings).length}</strong></li><li>История компаса: <strong>${state.snapshots.length}</strong></li><li>Записи дневника: <strong>${state.diary.length}</strong></li><li>Избранные практики: <strong>${state.favorites.length}</strong></li></ul><div class="callout mt16">Хранилище привязано к этому браузеру и расположению файла. При очистке данных браузера записи могут исчезнуть. Не удаляй резервную копию.</div></div><div class="card"><h3>Сброс данных</h3><p class="muted mt12">Удаление необратимо без резервной копии. Оно не затрагивает Android-приложение «Тише».</p><div class="mt20">${button('Удалить все данные','reset',{attr:'style="color:var(--danger)"'})}</div><div class="divider"></div><p class="small muted">HTML-адаптация, не оригинальный Android APK. Воспроизводит банк из 504 вопросов, 18 чувств, оригинальные истории и диалоги. Не использует сеть, рекламу и аналитические сервисы.</p></div></div>`}
async function execute(action,el){if(isResetting)return;const level=ui.level,mod=MODULES[ui.module],isJ=ui.route==='journey',routeIds=isJ?DATA.routes[level]:mod?.questions.map(q=>q.id);
switch(action){
 case 'demo':startDemo();break;
 case 'setup':if(storageOK&&localStorage.getItem(VAULT_KEY)){toast('Защищённое пространство уже существует. Открой его; создание нового поверх прежнего заблокировано.',true);return}ui.oldSession=session;ui.unlockMode='create';session='locked';render();break;
 case 'cancel-setup':if(ui.oldSession==='demo'){session='demo';ui.unlockMode='unlock';render()}else{session='locked';ui.unlockMode='unlock';render()}break;
 case 'create-vault':{const p=$('#create-pass')?.value||'',p2=$('#create-repeat')?.value||'';if(p!==p2){toast('Пароли не совпадают',true);return}try{await makeVault(p);ui.unlockMode='unlock'}catch(e){toast(e.message,true)}break}
 case 'unlock':{const p=$('#pass')?.value||'';if(!p){toast('Введи пароль',true);return}try{await unlockVault(p)}catch(e){toast(e.message,true)}break}
 case 'lock':if(session==='demo'&&totalAnswers()+state.diary.length+Object.keys(state.feelings).length>0&&!confirm('Демо не сохраняет данные. Закончить и потерять ответы этого сеанса?'))return;await persist();lockVault();break;
 case 'navigate':route(el.dataset.to);break;
 case 'mobile-more':ui.mobileMore=!ui.mobileMore;render();break;
 case 'open-journey':openJourney(el.dataset.level);break;
 case 'open-module':openModule(el.dataset.mid);break;
 case 'confirm-adult':ui.phqApproved=true;if(answeredModule(mod)===mod.questions.length)route('module-report');else render();break;
 case 'answer':{const qid=el.dataset.qid,v=Number(el.dataset.value);setAnswer(qid,v);const idx=ui.idx;render();if(state.prefs.autoNext){ui.autoforward=setTimeout(()=>{if(['journey','module'].includes(ui.route)&&ui.idx===idx)moveQuestion(1)},210)}break}
 case 'next-question':moveQuestion(1);break;
 case 'prev-question':moveQuestion(-1);break;
 case 'skip-question':moveQuestion(1);break;
 case 'view-report':route(isJ?'report':'module-report');break;
 case 'review-journey':route('journey',{idx:firstMissing(DATA.routes[ui.level]),demoReport:false});break;
 case 'review-module':route('module',{idx:firstMissing(mod.questions.map(q=>q.id))});break;
 case 'close-demo':route('tests',{demoReport:false});break;
 case 'preview-example':route('report',{level:el.dataset.level||'40',demoReport:true});break;
 case 'theme':case 'set-theme':state.prefs.theme=action==='theme'?(state.prefs.theme==='dark'?'light':'dark'):(el.dataset.mode==='light'?'light':'dark');persist();render();break;
 case 'save-compass':{let f=clone(state.feelings);if(!Object.keys(f).length){toast('Отметь хотя бы одно чувство',true);return}state.snapshots.push({id:id(),ts:Date.now(),feelings:f});state.snapshots=state.snapshots.slice(-200);persist();render();toast('Снимок компаса сохранён');break}
 case 'clear-compass':if(confirm('Снять текущие отметки? Сохранённые снимки останутся.')){state.feelings={};persist();render()}break;
 case 'unset-feeling':delete state.feelings[el.dataset.id];persist();render();break;
 case 'load-compass':{const shot=state.snapshots.find(x=>x.id===el.dataset.id);if(shot){state.feelings=clone(shot.feelings);persist();render();toast('Снимок загружен для просмотра')}}break;
 case 'favorite':{const v=el.dataset.id;state.favorites=state.favorites.includes(v)?state.favorites.filter(x=>x!==v):[...state.favorites,v];persist();render();break}
 case 'open-practice':route('practice',{practice:el.dataset.id});break;
 case 'practice-done':{if(!state.practicesDone.includes(el.dataset.id))state.practicesDone.push(el.dataset.id);persist();toast('Отмечено — без оценки и рекордов');route('practices');break}
 case 'diary-new':route('diary-edit',{diaryEdit:null,draft:''});break;
 case 'diary-edit':route('diary-edit',{diaryEdit:el.dataset.id,draft:''});break;
 case 'diary-save':{const text=$('#diary-text')?.value.trim()||'',tag=$('#diary-tag')?.value||'Наблюдение';if(!text){toast('Запись пустая',true);return}if(text.length>6000){toast('Максимум 6000 символов',true);return}const current=state.diary.find(x=>x.id===ui.diaryEdit);if(current){current.text=text;current.tag=tag;current.updated=Date.now()}else state.diary.push({id:id(),ts:Date.now(),tag,text});await persist();route('diary',{diaryEdit:null,draft:''});toast('Запись сохранена');break}
 case 'diary-delete':if(confirm('Удалить эту запись без возможности отмены?')){state.diary=state.diary.filter(x=>x.id!==el.dataset.id);persist();render();toast('Запись удалена')}break;
 case 'open-story':route('story',{story:el.dataset.id,storyPick:null});break;
 case 'story-choice':ui.storyPick=Number(el.dataset.index);render();break;
 case 'open-dialog':route('dialog',{dialog:el.dataset.id,dialogStep:0,dialogPick:null});break;
 case 'dialog-choice':ui.dialogPick=Number(el.dataset.index);render();break;
 case 'dialog-prev':ui.dialogStep=Math.max(0,ui.dialogStep-1);ui.dialogPick=null;render();break;
 case 'dialog-next':{if(ui.dialogStep>=2){const scene=DATA.dialogs.find(x=>x.id===ui.dialog);toast('Сценарий пройден. '+(scene?.closing||''));route('dialogs');break}ui.dialogStep+=1;ui.dialogPick=null;render();break}
 case 'export':exportVault();break;
 case 'import':importBackup();break;
 case 'print':window.print();break;
 case 'reset':{
  const answer=prompt('Чтобы безвозвратно удалить локальные ответы и дневник, напиши УДАЛИТЬ:');
  if(answer!=='УДАЛИТЬ')return;
  isResetting=true;
  try{
    if(session==='vault'){
      // Already queued AES-GCM writes must finish before deleting the only stored vault.
      // Otherwise an in-flight write could restore the data after deletion.
      await writeQueue.catch(()=>{});
      localStorage.removeItem(VAULT_KEY);
      key=null;salt=null;vault=null;session='locked';ui.unlockMode='unlock';
    }
    state=initial();ui.route='home';ui.mobileMore=false;
    isSaving=false;saveStatus='Защищено';
    render();toast('Локальные данные очищены');
  }catch(e){toast('Не удалось удалить данные: '+e.message,true)}
  finally{isResetting=false}
  break;
 }
 default:console.warn('Unknown action',action)
}}
function moveQuestion(step){const isJ=ui.route==='journey';if(!isJ&&!(['module'].includes(ui.route)))return;const routeIds=isJ?DATA.routes[ui.level]:MODULES[ui.module].questions.map(q=>q.id);const next=ui.idx+step;if(next<0)return;if(next>=routeIds.length){route(isJ?'report':'module-report');return}ui.idx=next;render();window.scrollTo(0,0)}
function importBackup(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=async()=>{try{
  const f=inp.files?.[0];if(!f)return;if(f.size>3000000)throw Error('Файл слишком большой');
  const obj=JSON.parse(await f.text());
  if(obj?.format!=='TisheWebEncryptedBackup'||obj.version!==1||typeof obj.salt!=='string'||typeof obj.iv!=='string'||typeof obj.cipher!=='string')throw Error('Это не зашифрованная резервная копия «Тише»');
  if(!hasCrypto())throw Error('Защищённое хранилище недоступно в этом браузере. Исходные данные не изменены.');
  const s=base64Bytes(obj.salt),iv=base64Bytes(obj.iv),cipher=base64Bytes(obj.cipher);
  if(s.length!==16||iv.length!==12||cipher.length<16||cipher.length>3000000)throw Error('Некорректный шифрованный файл');
  const password=prompt('Введите пароль от импортируемой резервной копии. Текущие данные пока не изменятся:');
  if(password===null)return;
  const importedKey=await derive(password,s);
  let restored;
  try{restored=normalizeState(await decryptPayload(obj,importedKey))}
  catch{throw Error('Не удалось открыть копию: неверный пароль или повреждение. Старые данные сохранены.')}
  if(!confirm('Резервная копия успешно проверена. Заменить текущие данные на её содержимое?'))return;
  await writeQueue;
  localStorage.setItem(VAULT_KEY,JSON.stringify(obj));
  state=restored;key=importedKey;salt=s;vault=obj;session='vault';ui.unlockMode='unlock';ui.mobileMore=false;
  route('home');toast('Копия восстановлена и открыта. Сделайте новую резервную копию при необходимости.');
 }catch(e){toast('Импорт не удался: '+e.message,true)}};
 inp.click();
}
function refreshCards(){if(ui.route==='tests'){const el=$('#survey-cards');if(el){const list=DATA.modules.filter(m=>ui.surveysGroup==='all'||m.group===ui.surveysGroup).filter(m=>`${m.title} ${m.group}`.toLowerCase().includes(ui.surveyTerm.toLowerCase()));el.innerHTML=list.map(moduleCard).join('')||'<div class="muted">Ничего не найдено.</div>'}}else if(ui.route==='practices'){const p=$('#practice-cards');if(p){const items=PRACTICES.filter(x=>(ui.practiceFilter==='all'||ui.practiceFilter==='favorites'||ui.practiceFilter===x.tag)&&(ui.practiceFilter!=='favorites'||state.favorites.includes(x.id))).filter(x=>(x.title+' '+x.tag+' '+x.why).toLowerCase().includes(ui.practiceTerm.toLowerCase()));p.innerHTML=items.map(x=>`<article class="card card-hover"><div class="row between"><div class="card-emoji">${x.icon}</div><button class="btn btn-sm" data-action="favorite" data-id="${x.id}">${state.favorites.includes(x.id)?'★':'☆'}</button></div><h3>${E(x.title)}</h3><p class="card-desc">${E(x.why)}</p><div class="card-footer"><span class="small muted">${x.time} мин · ${E(x.tag)}</span><button class="btn btn-sm btn-primary" data-action="open-practice" data-id="${x.id}">Начать ›</button></div></article>`).join('')||'<div class="card-soft">Ничего не найдено.</div>'}}else if(ui.route==='diary'){const e=$('#diary-list');if(e)render()}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();if(el.disabled)return;execute(el.dataset.action,el).catch(error=>{console.error(error);toast('Ошибка: '+(error?.message||'Не удалось выполнить действие'),true)})});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='survey-search'){ui.surveyTerm=el.value;refreshCards()}if(el.id==='practice-search'){ui.practiceTerm=el.value;refreshCards()}if(el.id==='diary-search'){ui.diaryTerm=el.value;refreshCards()}if(el.id==='diary-text')ui.draft=el.value;if(el.matches('[data-feeling]')){const output=document.getElementById('value-'+el.dataset.feeling);if(output)output.textContent=el.value}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='survey-filter'){ui.surveysGroup=el.value;refreshCards()}if(el.id==='practice-filter'){ui.practiceFilter=el.value;refreshCards()}if(el.matches('[data-feeling]')){setFeeling(el.dataset.feeling,Number(el.value));render()}if(el.id==='auto-next'||el.id==='auto-next-setting'){state.prefs.autoNext=el.checked;persist()} });
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&session==='locked'&&document.activeElement?.id==='pass')execute('unlock',document.getElementById('unlock-btn')||document.body);if(e.key==='Escape'&&['journey','module','report','module-report'].includes(ui.route))route('tests')});
function init(){storageOK=storage();applyTheme();try{if(storageOK&&localStorage.getItem(VAULT_KEY)){const obj=JSON.parse(localStorage.getItem(VAULT_KEY));if(obj?.format!=='TisheWebEncryptedBackup')toast('Защищённое хранилище имеет неизвестный формат',true)}}catch{toast('Не удалось прочитать метаданные хранилища',true)}render()}
window.addEventListener('unhandledrejection',e=>{console.error('Unhandled promise rejection',e.reason);toast('Возникла ошибка. Проверь сохранение.',true)});
window.addEventListener('error',e=>{console.error('Application error',e.message);toast('Ошибка приложения: '+e.message,true)});
// Deterministic pure read-only QA probes, enabled only by explicit ?tishe_qa=1.
if(location.search.includes('tishe_qa=1'))window.__TISHE_QA__=Object.freeze({routes:DATA.routes,modules:DATA.modules.length,report:(level,answers)=>sentenceReport(level,answers),single:(mid,answers)=>singleReport(MODULES[mid],answers),getSession:()=>session,getState:()=>clone(state)});
init();
})();
</script>
