:false},{"id":"anxiety_triggers.10","text":"Тревога усиливалась вечером, когда становилось меньше дел.","reverse":false}]},{"id":"rumination","title":"Мысленное застревание","kind":"custom","group":"Тревога и мысли","period":"За последние 2 недели","questions":[{"id":"rumination.1","text":"Я снова и снова вспоминал неловкие моменты.","reverse":false},{"id":"rumination.2","text":"Я искал идеальное объяснение тому, что уже произошло.","reverse":false},{"id":"rumination.3","text":"Мне было трудно остановить внутренний спор.","reverse":false},{"id":"rumination.4","text":"Я прокручивал разговор, пытаясь подобрать другой ответ.","reverse":false},{"id":"rumination.5","text":"Я чувствовал, что обязан разобраться с каждой тревожной мыслью.","reverse":false},{"id":"rumination.6","text":"Я терял время, мысленно исправляя прошлые решения.","reverse":false},{"id":"rumination.7","text":"Мысли мешали мне заснуть или вернуться к текущей задаче.","reverse":false},{"id":"rumination.8","text":"Я ругал себя за то, что снова думаю об одном и том же.","reverse":false},{"id":"rumination.9","text":"Я пытался окончательно доказать себе, что был прав.","reverse":false},{"id":"rumination.10","text":"Я замечал, что дальнейшее обдумывание уже не помогает.","reverse":false}]},{"id":"uncertainty","title":"Неопределённость и заверения","kind":"custom","group":"Тревога и мысли","period":"За последние 2 недели","questions":[{"id":"uncertainty.1","text":"Мне требовалось абсолютное подтверждение, что я ничего не забыл.","reverse":false},{"id":"uncertainty.2","text":"После проверки мне быстро хотелось проверить ещё раз.","reverse":false},{"id":"uncertainty.3","text":"Я спрашивал у других, всё ли точно в порядке.","reverse":false},{"id":"uncertainty.4","text":"Я долго искал в интернете ответы, чтобы перестать тревожиться.","reverse":false},{"id":"uncertainty.5","text":"Я испытывал сильный дискомфорт, не получая точного ответа.","reverse":false},{"id":"uncertainty.6","text":"Мне было сложно оставить небольшую ошибку неисправленной.","reverse":false},{"id":"uncertainty.7","text":"Я чувствовал облегчение после проверки, но оно быстро проходило.","reverse":false},{"id":"uncertainty.8","text":"Из-за сомнений я долго не мог принять простое решение.","reverse":false},{"id":"uncertainty.9","text":"Мне хотелось мысленно повторять действия, чтобы убедиться в их правильности.","reverse":false},{"id":"uncertainty.10","text":"Проверки или заверения мешали мне заниматься важными делами.","reverse":false}]},{"id":"avoidance","title":"Избегание и осторожность","kind":"custom","group":"Тревога и мысли","period":"За последние 2 недели","questions":[{"id":"avoidance.1","text":"Я не начинал дело, чтобы не испытать возможную неудачу.","reverse":false},{"id":"avoidance.2","text":"Я избегал общения из-за ожидания оценки.","reverse":false},{"id":"avoidance.3","text":"Я откладывал обычные задачи до «подходящего настроения».","reverse":false},{"id":"avoidance.4","text":"Я отказывался от новых мест из-за неопределённости.","reverse":false},{"id":"avoidance.5","text":"Я скрывал потребности, опасаясь конфликта.","reverse":false},{"id":"avoidance.6","text":"Я отменял планы из-за тревоги, хотя хотел пойти.","reverse":false},{"id":"avoidance.7","text":"Я переключался на телефон, чтобы не сталкиваться с неприятным чувством.","reverse":false},{"id":"avoidance.8","text":"Я не задавал вопросы, чтобы не показаться глупым.","reverse":false},{"id":"avoidance.9","text":"Мне было трудно вернуться к делу после одного неприятного опыта.","reverse":false},{"id":"avoidance.10","text":"Избегание приносило краткое облегчение, но усложняло жизнь позже.","reverse":false}]},{"id":"mood_patterns","title":"Перепады и оттенки настроения","kind":"custom","group":"Настроение и энергия","period":"За последние 2 недели","questions":[{"id":"mood_patterns.1","text":"Я просыпался без ощущения предвкушения дня.","reverse":false},{"id":"mood_patterns.2","text":"Моё настроение менялось в течение дня заметно для меня.","reverse":false},{"id":"mood_patterns.3","text":"Я чувствовал себя одиноким даже среди людей.","reverse":false},{"id":"mood_patterns.4","text":"Мне было трудно испытывать удовольствие от знакомых занятий.","reverse":false},{"id":"mood_patterns.5","text":"Я замечал раздражительность вместе с грустью.","reverse":false},{"id":"mood_patterns.6","text":"У меня появлялись моменты эмоциональной пустоты.","reverse":false},{"id":"mood_patterns.7","text":"Я избегал общения из-за подавленности.","reverse":false},{"id":"mood_patterns.8","text":"Небольшое событие заметно ухудшало моё настроение.","reverse":false},{"id":"mood_patterns.9","text":"Мне было сложно назвать, какое именно чувство преобладает.","reverse":false},{"id":"mood_patterns.10","text":"Плохое настроение мешало мне выполнять привычные дела.","reverse":false}]},{"id":"body_signals","title":"Эмоции и ощущения в теле","kind":"custom","group":"Настроение и энергия","period":"За последние 2 недели","questions":[{"id":"body_signals.1","text":"Я замечал напряжение челюстей или плеч при переживаниях.","reverse":false},{"id":"body_signals.2","text":"Мне бывало сложно понять, голоден я, устал или расстроен.","reverse":false},{"id":"body_signals.3","text":"Когда я волновался, внимание застревало на телесных ощущениях.","reverse":false},{"id":"body_signals.4","text":"Я обнаруживал, что задерживаю дыхание от напряжения.","reverse":false},{"id":"body_signals.5","text":"Из-за стресса я сутулился или сжимал руки.","reverse":false},{"id":"body_signals.6","text":"Мне трудно было заметить первые признаки переутомления.","reverse":false},{"id":"body_signals.7","text":"Я продолжал дела, не замечая потребности в отдыхе.","reverse":false},{"id":"body_signals.8","text":"Я путал возбуждение, злость и тревогу.","reverse":false},{"id":"body_signals.9","text":"Обычные телесные ощущения иногда пугали меня.","reverse":false},{"id":"body_signals.10","text":"После эмоциональной нагрузки мне требовалось время восстановиться.","reverse":false}]},{"id":" е отличное.","reverse":false},{"id":"perfectionism.9","text":"Я избегал пробовать новое без гарантии успеха.","reverse":false},{"id":"perfectionism.10","text":"Мои требования к себе мешали мне отдыхать.","reverse":false}]},{"id":"boundaries","title":"Личные границы","kind":"custom","group":"Отношения","period":"Обычно","questions":[{"id":"boundaries.1","text":"Я говорил «да», когда на самом деле хотел отказать.","reverse":false},{"id":"boundaries.2","text":"Мне было трудно попросить тишины или личного пространства.","reverse":false},{"id":"boundaries.3","text":"Я чувствовал вину после разумного отказа.","reverse":false},{"id":"boundaries.4","text":"Я ожидал, что другие сами догадаются о моих потребностях.","reverse":false},{"id":"boundaries.5","text":"Я не замечал перегрузки, пока не начинал раздражаться.","reverse":false},{"id":"boundaries.6","text":"Мне было сложно спокойно сказать о нарушенной договорённости.","reverse":false},{"id":"boundaries.7","text":"Я соглашался на неудобные планы, чтобы не разочаровать других.","reverse":false},{"id":"boundaries.8","text":"Мне было трудно уважительно обсуждать разные желания.","reverse":false},{"id":"boundaries.9","text":"Я боялся, что мои границы испортят отношения.","reverse":false},{"id":"boundaries.10","text":"Я откладывал важный разговор о своих потребностях.","reverse":false}]},{"id":"support_network","title":"Поддержка и доверие","kind":"custom","group":"Отношения","period":"За последний месяц","questions":[{"id":"support_network.1","text":"Мне было сложно назвать человека, которому можно написать в трудный день.","reverse":false},{"id":"support_network.2","text":"Я стеснялся просить о конкретной помощи.","reverse":false},{"id":"support_network.3","text":"Я чувствовал себя непонятым близкими.","reverse":false},{"id":"support_network.4","text":"Я редко рассказывал о сложных эмоциях.","reverse":false},{"id":"support_network.5","text":"После общения я часто чувствовал себя эмоционально истощённым.","reverse":false},{"id":"support_network.6","text":"Я сомневался, что мои переживания заслуживают внимания.","reverse":false},{"id":"support_network.7","text":"Я не знал, как попросить просто выслушать меня.","reverse":false},{"id":"support_network.8","text":"Мне недоставало спокойного общения без оценок.","reverse":false},{"id":"support_network.9","text":"Я опасался, что меня осудят за эмоции.","reverse":false},{"id":"support_network.10","text":"Я отдалялся от людей, когда мне особенно нужна была поддержка.","reverse":false}]},{"id":"social_anxiety","title":"Смущение и социальные ситуации","kind":"custom","group":"Отношения","period":"За последний месяц","questions":[{"id":"social_anxiety.1","text":"Мне было сложно заговорить с незнакомым человеком.","reverse":false},{"id":"social_anxiety.2","text":"Я переживал, как звучит мой голос в разговоре.","reverse":false},{"id":"social_anxiety.3","text":"Я боялся показаться нелепым в компании.","reverse":false},{"id":"social_anxiety.4","text":"Я избегал задавать уточняющие вопросы публично.","reverse":false},{"id":"social_anxiety.5","text":"После встречи я долго вспоминал, как выглядел со стороны.","reverse":false},{"id":"social_anxiety.6","text":"Я старался не привлекать внимание даже в безопасной ситуации.","reverse":false},{"id":"social_anxiety.7","text":"Мне было трудно высказать собственное мнение при других.","reverse":false},{"id":"social_anxiety.8","text":"Я опасался, что люди заметят моё волнение.","reverse":false},{"id":"social_anxiety.9","text":"Я отменял встречи из-за опасения неловкости.","reverse":false},{"id":"social_anxiety.10","text":"Социальные тревоги мешали мне поддерживать нужные связи.","reverse":false}]},{"id":"sleep_routine","title":"Сон и ежедневный ритм","kind":"custom","group":"Ресурсы и быт","period":"За последние 2 недели","questions":[{"id":"sleep_routine.1","text":"Я ложился спать в сильно разное время.","reverse":false},{"id":"sleep_routine.2","text":"Вечером я долго оставался с экраном, хотя хотел отдохнуть.","reverse":false},{"id":"sleep_routine.3","text":"Я чувствовал, что сон не восстанавливает мои силы.","reverse":false},{"id":"sleep_routine.4","text":"Перед сном я мысленно возвращался к незакрытым делам.","reverse":false},{"id":"sleep_routine.5","text":"Я просыпался и сразу ощущал напряжение.","reverse":false},{"id":"sleep_routine.6","text":"Мне не хватало возможности спокойно завершить день.","reverse":false},{"id":"sleep_routine.7","text":"Я откладывал сон, чтобы побыть наедине с собой.","reverse":false},{"id":"sleep_routine.8","text":"После плохой ночи мне было труднее регулировать эмоции.","reverse":false},{"id":"sleep_routine.9","text":"Мой распорядок дня почти не включал перерывов.","reverse":false},{"id":"sleep_routine.10","text":"Я не замечал, когда пора уменьшить нагрузку.","reverse":false}]},{"id":"burnout_signals","title":"Перегрузка и истощение","kind":"custom","group":"Ресурсы и быт","period":"За последний месяц","questions":[{"id":"burnout_signals.1","text":"Я чувствовал эмоциональное истощение от обязанностей.","reverse":false},{"id":"burnout_signals.2","text":"Задачи, которые раньше давались легко, стали казаться слишком тяжёлыми.","reverse":false},{"id":"burnout_signals.3","text":"Я раздражался даже во время отдыха.","reverse":false},{"id":"burnout_signals.4","text":"Мне не хватало времени восстановиться между делами.","reverse":false},{"id":"burnout_signals.5","text":"Я ощущал, что должен всегда быть на связи.","reverse":false},{"id":"burnout_signals.6","text":"Я с трудом видел смысл в рутинных обязанностях.","reverse":false},{"id":"burnout_signals.7","text":"Мне казалось, что от меня требуют больше, чем я могу дать.","reverse":false},{"id":"burnout_signals.8","text":"Я откладывал отдых до окончания всех задач.","reverse":false},{"id":"burnout_signals.9","text":"Я не мог повлиять на часть своей ежедневной нагрузки.","reverse":false},{"id":"burnout_signals.10","text":"Я замечал ухудшение настроения на фоне перегрузки.","reverse":false}]},{"id":"attention_fatigue","title":"Внимание и усталость","kind":"custom","group":"Ресурсы и быт","period":"За последние 2 недели","questions":[{"id":"attention_fatigue.1","text":"Я часто переходил от одной задачи к другой, не закончив первую.","reverse":false},{"id":"attention_fatigue.2","text":"Уведомления легко прерывали мою работу.","reverse":false},{"id":"attention_fatigue.3","text":"Мне было трудно начать дело из-за большого количества шагов.","reverse":false},{"id":"attention_fatigue.4","text":"Я забывал, что хотел сделать, когда уставал.","reverse":false},{"id":"attention_fatigue.5","text":"Я чувствовал ступор, когда нужно было выбрать из многих вариантов.","reverse":false},{"id":"attention_fatigue.6","text":"Мне было сложно держать в голове несколько задач.","reverse":false},{"id":"attention_fatigue.7","text":"Мои мысли уводили меня от текущего действия.","reverse":false},{"id":"attention_fatigue.8","text":"Я пытался делать слишком многое одновременно.","reverse":false},{"id":"attention_fatigue.9","text":"Большой список дел заставлял меня отказаться от начала.","reverse":false},{"id":"attention_fatigue.10","text":"Я редко позволял себе короткий перерыв для восстановления внимания.","reverse":false}]},{"id":"sensory_context","title":"Комфорт среды","kind":"custom","group":"Ресурсы и быт","period":"За последний месяц","questions":[{"id":"sensory_context.1","text":"Резкие звуки заметно усиливали мою усталость.","reverse":false},{"id":"sensory_context.2","text":"Я быстрее раздражался в шумном помещении.","reverse":false},{"id":"sensory_context.3","text":"Я чувствовал перегрузку в большом скоплении людей.","reverse":false},{"id":"sensory_context.4","text":"Я избегал яркого света, когда уже был напряжён.","reverse":false},{"id":"sensory_context.5","text":"Мне было сложно сосредоточиться при нескольких источниках звука.","reverse":false},{"id":"sensory_context.6","text":"Неожиданные прикосновения вызывали неприятное напряжение.","reverse":false},{"id":"sensory_context.7","text":"Для восстановления мне часто требовалась тишина.","reverse":false},{"id":"sensory_context.8","text":"Много экранных уведомлений усиливали перегрузку.","reverse":false},{"id":"sensory_context.9","text":"Мне было трудно расслабиться в захламлённом пространстве.","reverse":false},{"id":"sensory_context.10","text":"Я игнорировал собственный дискомфорт до сильной усталости.","reverse":false}]},{"id":"coping_styles","title":"Как я пытаюсь справляться","kind":"custom","group":"Навыки и восстановление","period":"За последние 2 недели","questions":[{"id":"coping_styles.1","text":"При сильных эмоциях я сразу отвлекался, не понимая свою потребность.","reverse":false},{"id":"coping_styles.2","text":"Я откладывал неприятный разговор до крайнего момента.","reverse":false},{"id":"coping_styles.3","text":"Я надеялся, что тревога исчезнет, только если всё проконтролирую.","reverse":false},{"id":"coping_styles.4","text":"Я избегал отдыха, стараясь занять себя делами.","reverse":false},{"id":"coping_styles.5","text":"Я упрекал себя за любое неприятное чувство.","reverse":false},{"id":"coping_styles.6","text":"Я справлялся со стрессом, бесконечно листая ленту.","reverse":false},{"id":"coping_styles.7","text":"Я пытался решить сложную задачу на пике раздражения.","reverse":false},{"id":"coping_styles.8","text":"Я игнорировал ранние признаки усталости.","reverse":false},{"id":"coping_styles.9","text":"Я ждал сильной мотивации, прежде чем сделать первый шаг.","reverse":false},{"id":"coping_styles.10","text":"Мне было трудно выбрать спокойную и безопасную реакцию.","reverse":false}]},{"id":"behavioral_activation","title":"Что помогает начать","kind":"custom","group":"Навыки и восстановление","period":"За последние 2 недели","questions":[{"id":"behavioral_activation.1","text":"Мне было трудно выбрать самую маленькую часть задачи.","reverse":false},{"id":"behavioral_activation.2","text":"Я ожидал, что сначала появится настроение, а потом начну.","reverse":false},{"id":"behavioral_activation.3","text":"Я откладывал приятные занятия из-за ощущения вины.","reverse":false},{"id":"behavioral_activation.4","text":"Я считал короткие занятия бесполезными.","reverse":false},{"id":"behavioral_activation.5","text":"Я не замечал разницы между усталостью и отсутствием интереса.","reverse":false},{"id":"behavioral_activation.6","text":"Я часто ставил цели, на которые у меня не было сил.","reverse":false},{"id":"behavioral_activation.7","text":"Мне было сложно найти недорогое и доступное занятие.","reverse":false},{"id":"behavioral_activation.8","text":"Я не понимал, что приносит мне хотя бы немного интереса.","reverse":false},{"id":"behavioral_activation.9","text":"Я бросал занятие, если оно не радовало сразу.","reverse":false},{"id":"behavioral_activation.10","text":"Я сравнивал собственный темп с чужим.","reverse":false}]},{"id":"emotion_language","title":"Различать чувства","kind":"custom","group":"Навыки и восстановление","period":"Обычно","questions":[{"id":"emotion_language.1","text":"Я говорил «мне плохо», не понимая конкретной эмоции.","reverse":false},{"id":"emotion_language.2","text":"Я путал злость с усталостью.","reverse":false},{"id":"emotion_language.3","text":"Я путал тревогу с возбуждением или предвкушением.","reverse":false},{"id":"emotion_language.4","text":"Мне было трудно назвать, что именно меня задело.","reverse":false},{"id":"emotion_language.5","text":"Я замечал чувства только тогда, когда они становились очень сильными.","reverse":false},{"id":"emotion_language.6","text":"Мне трудно было объяснить, в какой поддержке я нуждаюсь.","reverse":false},{"id":"emotion_language.7","text":"Я считал, что одновременно нельзя чувствовать противоположные эмоции.","reverse":false},{"id":"emotion_language.8","text":"Я быстро оценивал эмоции как «плохие» или «неправильные».","reverse":false},{"id":"emotion_language.9","text":"Я игнорировал смешанные чувства.","reverse":false},{"id":"emotion_language.10","text":"Мне было сложно связать эмоцию с конкретным событием и потребностью.","reverse":false}]},{"id":"values_direction","title":"Смысл и личные ориентиры","kind":"custom","group":"Ценности и занятия","period":"Обычно","questions":[{"id":"values_direction.1","text":"Мне было трудно назвать то, что действительно важно лично мне.","reverse":false},{"id":"values_direction.2","text":"Я строил планы в основном из чужих ожиданий.","reverse":false},{"id":"values_direction.3","text":"Я редко оставлял время на интересы без полезного результата.","reverse":false},{"id":"values_direction.4","text":"Я сомневался, что имею право менять жизненные планы.","reverse":false},{"id":"values_direction.5","text":"Я считал маленькие шаги недостаточными для значимой цели.","reverse":false},{"id":"values_direction.6","text":"Мне было трудно отделить собственные желания от привычки «надо».","reverse":false},{"id":"values_direction.7","text":"Я откладывал исследование новых увлечений из-за страха неудачи.","reverse":false},{"id":"values_direction.8","text":"Мне не хватало занятий просто ради любопытства.","reverse":false},{"id":"values_direction.9","text":"Я часто выбирал дело только потому, что «так принято».","reverse":false},{"id":"values_direction.10","text":"Мне было трудно заметить, какие занятия дают чувство вовлечённости.","reverse":false}]},{"id":"hobby_barriers","title":"Барьеры к увлечениям","kind":"custom","group":"Ценности и занятия","period":"Обычно","questions":[{"id":"hobby_barriers.1","text":"Я отказывался от увлечения, если не мог выделить на него много времени.","reverse":false},{"id":"hobby_barriers.2","text":"Я думал, что заниматься чем-то интересно можно только за деньги.","reverse":false},{"id":"hobby_barriers.3","text":"Мне было сложно выбрать хобби из слишком многих вариантов.","reverse":false},{"id":"hobby_barriers.4","text":"Я стеснялся быть новичком в занятии.","reverse":false},{"id":"hobby_barriers.5","text":"Я часто ждал идеальных условий, прежде чем попробовать.","reverse":false},{"id":"hobby_barriers.6","text":"Меня пугала необходимость покупать оборудование.","reverse":false},{"id":"hobby_barriers.7","text":"Я быстро сравнивал свои результаты с более опытными людьми.","reverse":false},{"id":"hobby_barriers.8","text":"Мне казалось, что хобби должно обязательно приносить пользу.","reverse":false},{"id":"hobby_barriers.9","text":"Я опасался заниматься в одиночку тем, что интересно.","reverse":false},{"id":"hobby_barriers.10","text":"Мне хотелось попробовать что-то новое, но я не знал первого бесплатного шага.","reverse":false}]},{"id":"emotion_layers","title":"Смешанные эмоции и оттенки","kind":"reflection","group":"Эмоции","period":"Последние две недели","questions":[{"id":"emotion_layers.1","text":"После события я замечал больше одного чувства одновременно.","reverse":false},{"id":"emotion_layers.2","text":"Мне было сложно разделить грусть и обиду.","reverse":false},{"id":"emotion_layers.3","text":"За раздражением я обнаруживал усталость или разочарование.","reverse":false},{"id":"emotion_layers.4","text":"Я замечал облегчение и тревогу одновременно.","reverse":false},{"id":"emotion_layers.5","text":"Мне трудно было понять, что важнее: злость или страх.","reverse":false},{"id":"emotion_layers.6","text":"Когда настроение менялось, я пытался немедленно найти причину.","reverse":false},{"id":"emotion_layers.7","text":"Я испытывал вину за радость в трудный период.","reverse":false},{"id":"emotion_layers.8","text":"Мне хотелось, чтобы окружающие понимали сложные чувства без объяснений.","reverse":false},{"id":"emotion_layers.9","text":"Я путал подавленность с потребностью в одиночестве.","reverse":false},{"id":"emotion_layers.10","text":"Мне трудно было признать одновременно любовь и раздражение к одному человеку.","reverse":false},{"id":"emotion_layers.11","text":"Я замечал телесное напряжение, прежде чем мог назвать эмоцию.","reverse":false},{"id":"emotion_layers.12","text":"Я редко находил слова для чувств, которые не похожи ни на грусть, ни на злость.","reverse":false}]},{"id":"anger_choices","title":"Гнев: выбор реакции","kind":"reflection","group":"Эмоции","period":"Последние две недели","questions":[{"id":"anger_choices.1","text":"Я замечал, что мой голос становился громче до осознания злости.","reverse":false},{"id":"anger_choices.2","text":"Мне хотелось ответить на сообщение сразу, пока я сердился.","reverse":false},{"id":"anger_choices.3","text":"После вспышки я сожалел о выбранных словах.","reverse":false},{"id":"anger_choices.4","text":"Я мог попросить паузу до продолжения сложного разговора.","reverse":false},{"id":"anger_choices.5","text":"Я замечал, какие границы были нарушены в конфликте.","reverse":false},{"id":"anger_choices.6","text":"Мне было трудно отличить просьбу от обвинения.","reverse":false},{"id":"anger_choices.7","text":"Я считал, что уступить в мелочи значит проиграть спор.","reverse":false},{"id":"anger_choices.8","text":"При раздражении я переставал слышать объяснение другого человека.","reverse":false},{"id":"anger_choices.9","text":"Я пытался продолжить спор, хотя силы закончились.","reverse":false},{"id":"anger_choices.10","text":"Я заранее продумывал безопасную фразу для выхода из конфликта.","reverse":false},{"id":"anger_choices.11","text":"Я переносил накопленную злость с одного человека на другого.","reverse":false},{"id":"anger_choices.12","text":"Мне трудно было вернуться к разговору после паузы без обвинений.","reverse":false}]},{"id":"worry_decisions","title":"Тревога и принятие решений","kind":"reflection","group":"Мысли и реакции","period":"Последний месяц","questions":[{"id":"worry_decisions.1","text":"Перед небольшим выбором я представлял множество неприятных последствий.","reverse":false},{"id":"worry_decisions.2","text":"Я откладывал решение, пока не получал дополнительной уверенности.","reverse":false},{"id":"worry_decisions.3","text":"Мне было сложно решить, какая информация действительно необходима.","reverse":false},{"id":"worry_decisions.4","text":"Я представлял, что одна ошибка испортит всю ситуацию.","reverse":false},{"id":"worry_decisions.5","text":"Я мог назвать один конкретный следующий шаг вместо поиска идеального плана.","reverse":false},{"id":"worry_decisions.6","text":"Я чувствовал напряжение, когда выбор нельзя было отменить.","reverse":false},{"id":"worry_decisions.7","text":"Я многократно сравнивал почти одинаковые варианты.","reverse":false},{"id":"worry_decisions.8","text":"Я путал возможность неприятности с её вероятностью.","reverse":false},{"id":"worry_decisions.9","text":"Мне было трудно остановить поиск новых мнений.","reverse":false},{"id":"worry_decisions.10","text":"Я замечал, когда тревога заставляла меня менять уже принятое решение.","reverse":false},{"id":"worry_decisions.11","text":"Я избегал просьб о помощи, опасаясь выглядеть некомпетентным.","reverse":false},{"id":"worry_decisions.12","text":"Мне удавалось принять «достаточно хорошее» решение без полной определённости.","reverse":false}]},{"id":"compulsion_context","title":"Навязчивые циклы и отвлечение","kind":"reflection","group":"Мысли и реакции","period":"Последние две недели","questions":[{"id":"compulsion_context.1","text":"Я возвращался к одному действию, чтобы ненадолго почувствовать облегчение.","reverse":false},{"id":"compulsion_context.2","text":"Мне хотелось спросить у другого человека то, что он уже объяснил.","reverse":false},{"id":"compulsion_context.3","text":"Я перепроверял обычные действия чаще, чем собирался.","reverse":false},{"id":"compulsion_context.4","text":"После проверки появлялось новое сомнение.","reverse":false},{"id":"compulsion_context.5","text":"Я замечал разницу между разумной проверкой безопасности и повтором ради успокоения.","reverse":false},{"id":"compulsion_context.6","text":"Мне было трудно оставить неприятный вопрос без ответа прямо сейчас.","reverse":false},{"id":"compulsion_context.7","text":"Я мысленно повторял события в поисках окончательной уверенности.","reverse":false},{"id":"compulsion_context.8","text":"Я откладывал приятное занятие до завершения внутренней проверки.","reverse":false},{"id":"compulsion_context.9","text":"Мне было стыдно рассказывать о повторяющихся мыслях.","reverse":false},{"id":"compulsion_context.10","text":"Я пытался изгнать мысль усилием воли, и она возвращалась.","reverse":false},{"id":"compulsion_context.11","text":"Я замечал желание искать гарантии в интернете.","reverse":false},{"id":"compulsion_context.12","text":"Я мог вернуться к обычному делу, даже если сомнение ещё оставалось.","reverse":false}]},{"id":"low_energy_paths","title":"Апатия и щадящая активность","kind":"reflection","group":"Ресурсы и быт","period":"Последние две недели","questions":[{"id":"low_energy_paths.1","text":"Мне проще начинать, когда действие длится меньше двух минут.","reverse":false},{"id":"low_energy_paths.2","text":"Даже выбор между двумя делами казался утомительным.","reverse":false},{"id":"low_energy_paths.3","text":"Я замечал различие между физической усталостью и отсутствием интереса.","reverse":false},{"id":"low_energy_paths.4","text":"После небольшого движения мне иногда становилось легче включиться в день.","reverse":false},{"id":"low_energy_paths.5","text":"Я отказывался от занятия, когда не мог выполнить его полностью.","reverse":false},{"id":"low_energy_paths.6","text":"Я избегал любимого дела из-за мысли, что не получу удовольствия.","reverse":false},{"id":"low_energy_paths.7","text":"Мне было проще действовать рядом с поддерживающим человеком.","reverse":false},{"id":"low_energy_paths.8","text":"Я раздражался на себя за необходимость отдыхать.","reverse":false},{"id":"low_energy_paths.9","text":"Я забывал, что маленькое действие тоже может быть значимым.","reverse":false},{"id":"low_energy_paths.10","text":"Я чувствовал облегчение после выполнения одной посильной задачи.","reverse":false},{"id":"low_energy_paths.11","text":"Я ставил задачи, требующие больше сил, чем было в тот день.","reverse":false},{"id":"low_energy_paths.12","text":"Я мог выбрать отдых без необходимости заслужить его.","reverse":false}]},{"id":"social_safety","title":"Близость, доверие и поддержка","kind":"reflection","group":"Отношения","period":"Последний месяц","questions":[{"id":"social_safety.1","text":"Мне трудно сообщать близкому, какая помощь мне нужна.","reverse":false},{"id":"social_safety.2","text":"Я беспокоился, что просьба о поддержке станет обузой.","reverse":false},{"id":"social_safety.3","text":"Я мог назвать хотя бы одного человека, рядом с которым мне спокойно.","reverse":false},{"id":"social_safety.4","text":"Я скрывал печаль, чтобы не тревожить других.","reverse":false},{"id":"social_safety.5","text":"Я соглашался на общение, когда нуждался в одиночестве.","reverse":false},{"id":"social_safety.6","text":"Я считал, что должен объяснить свои чувства идеально.","reverse":false},{"id":"social_safety.7","text":"Я замечал, что определённые разговоры придают мне сил.","reverse":false},{"id":"social_safety.8","text":"Я избегал общения из страха быть неправильно понятым.","reverse":false},{"id":"social_safety.9","text":"Мне было трудно отказывать без подробных оправданий.","reverse":false},{"id":"social_safety.10","text":"Я мог завершить разговор, когда чувствовал перегрузку.","reverse":false},{"id":"social_safety.11","text":"Я часто ожидал, что другие догадаются о моей обиде.","reverse":false},{"id":"social_safety.12","text":"Я чувствовал себя одиноко даже среди знакомых людей.","reverse":false}]},{"id":"recovery_choices","title":"Восстановление и ритм дня","kind":"reflection","group":"Ресурсы и быт","period":"Последние две недели","questions":[{"id":"recovery_choices.1","text":"Я замечал, после каких занятий мне легче восстановить внимание.","reverse":false},{"id":"recovery_choices.2","text":"Мне было непросто сделать перерыв, не глядя в телефон.","reverse":false},{"id":"recovery_choices.3","text":"Я просыпался без ощущения отдыха.","reverse":false},{"id":"recovery_choices.4","text":"Я слишком поздно замечал, что хочу есть или пить.","reverse":false},{"id":"recovery_choices.5","text":"У меня были спокойные привычные ритуалы завершения дня.","reverse":false},{"id":"recovery_choices.6","text":"Я планировал дела так плотно, что не оставалось запаса сил.","reverse":false},{"id":"recovery_choices.7","text":"Мне мешали внезапные уведомления перед сном.","reverse":false},{"id":"recovery_choices.8","text":"Я ощущал разницу между тишиной и социальной изоляцией.","reverse":false},{"id":"recovery_choices.9","text":"Мне было трудно выбрать отдых, который действительно подходит.","reverse":false},{"id":"recovery_choices.10","text":"После напряжённого разговора мне требовалось время без новых задач.","reverse":false},{"id":"recovery_choices.11","text":"Я замечал, что освещение или шум влияют на мое состояние.","reverse":false},{"id":"recovery_choices.12","text":"Я позволял себе менять план, когда силы заканчивались.","reverse":false}]},{"id":"self_kindness_style","title":"Отношение к себе в трудности","kind":"reflection","group":"Навыки и восстановление","period":"Последний месяц","questions":[{"id":"self_kindness_style.1","text":"После ошибки я говорил себе более жёстко, чем другу.","reverse":false},{"id":"self_kindness_style.2","text":"Мне казалось, что отдых означает слабость.","reverse":false},{"id":"self_kindness_style.3","text":"Я мог признать собственное усилие, даже если результат не получился.","reverse":false},{"id":"self_kindness_style.4","text":"Я сравнивал себя с людьми, у которых были другие обстоятельства.","reverse":false},{"id":"self_kindness_style.5","text":"Мне было трудно попросить помощи без чувства вины.","reverse":false},{"id":"self_kindness_style.6","text":"Я считал неприятные эмоции доказательством личной неудачи.","reverse":false},{"id":"self_kindness_style.7","text":"Я замечал свои успехи только после похвалы со стороны.","reverse":false},{"id":"self_kindness_style.8","text":"Мне было трудно остановить внутреннюю критику после спора.","reverse":false},{"id":"self_kindness_style.9","text":"Я мог признать ошибку, не определяя себя через неё.","reverse":false},{"id":"self_kindness_style.10","text":"Я ожидал от себя одинаковой эффективности каждый день.","reverse":false},{"id":"self_kindness_style.11","text":"Я мог описать трудность без унизительных слов о себе.","reverse":false},{"id":"self_kindness_style.12","text":"Я разрешал себе учиться чему-то без требования мастерства.","reverse":false}]},{"id":"sensory_ground","title":"Ощущения, внимание и безопасность","kind":"reflection","group":"Навыки и восстановление","period":"Последние две недели","questions":[{"id":"sensory_ground.1","text":"Когда нервничал, мне помогало смотреть на знакомые предметы.","reverse":false},{"id":"sensory_ground.2","text":"Фокусировка на дыхании иногда делала меня тревожнее.","reverse":false},{"id":"sensory_ground.3","text":"Шум усиливал мою раздражительность быстрее обычного.","reverse":false},{"id":"sensory_ground.4","text":"Мне легче успокоиться, когда можно оставить глаза открытыми.","reverse":false},{"id":"sensory_ground.5","text":"В тесном пространстве я хотел найти спокойное место.","reverse":false},{"id":"sensory_ground.6","text":"Некоторые упражнения с телом казались мне неприятными.","reverse":false},{"id":"sensory_ground.7","text":"Мне помогало выбрать один нейтральный звук.","reverse":false},{"id":"sensory_ground.8","text":"Я предпочитал упражнения без таймера и соревнования.","reverse":false},{"id":"sensory_ground.9","text":"Мне было важно иметь возможность прервать упражнение.","reverse":false},{"id":"sensory_ground.10","text":"Слишком яркая анимация мешала мне расслабиться.","reverse":false},{"id":"sensory_ground.11","text":"Я замечал, какие положения тела комфортны, а какие нет.","reverse":false},{"id":"sensory_ground.12","text":"Мне нравилось переключаться на цвета, формы или текстуры вокруг.","reverse":false}]},{"id":"interests_realistic","title":"Интересы и доступные занятия","kind":"reflection","group":"Ценности и занятия","period":"Последний месяц","questions":[{"id":"interests_realistic.1","text":"Я выбирал хобби исходя из того, что уже есть у меня дома.","reverse":false},{"id":"interests_realistic.2","text":"Я откладывал пробу нового занятия из-за высокой стоимости оборудования.","reverse":false},{"id":"interests_realistic.3","text":"Мне приятно узнавать что-то новое короткими подходами.","reverse":false},{"id":"interests_realistic.4","text":"Я предпочитаю спокойные занятия в одиночку.","reverse":false},{"id":"interests_realistic.5","text":"Мне было бы интересно творить без оценки результата.","reverse":false},{"id":"interests_realistic.6","text":"Я чаще выбираю занятия, в которых можно немного двигаться.","reverse":false},{"id":"interests_realistic.7","text":"Я предпочитаю занятия, которые можно прервать в любой момент.","reverse":false},{"id":"interests_realistic.8","text":"Мне нравится замечать детали в природе или городе.","reverse":false},{"id":"interests_realistic.9","text":"Мне помогают занятия, которые можно делать с близким человеком.","reverse":false},{"id":"interests_realistic.10","text":"Я предпочитаю знакомые занятия в дни сильной тревоги.","reverse":false},{"id":"interests_realistic.11","text":"Мне сложно решить, какое из множества увлечений попробовать первым.","reverse":false},{"id":"interests_realistic.12","text":"Мне приятно коротко записывать мысли, идеи или наблюдения.","reverse":false}]},{"id":"daily_agency","title":"Выбор и ощущение влияния","kind":"reflection","group":"Ценности и занятия","period":"Последний месяц","questions":[{"id":"daily_agency.1","text":"Я мог назвать одну область жизни, где от меня зависит небольшой шаг.","reverse":false},{"id":"daily_agency.2","text":"Я пытался решить сразу все накопившиеся проблемы.","reverse":false},{"id":"daily_agency.3","text":"Мне было трудно разделить чужие ожидания и собственный выбор.","reverse":false},{"id":"daily_agency.4","text":"Я замечал, когда выполнял задачу автоматически, не понимая зачем.","reverse":false},{"id":"daily_agency.5","text":"Я откладывал маленькое решение, ожидая большого изменения.","reverse":false},{"id":"daily_agency.6","text":"Мне было проще действовать, когда цель совпадала с личной ценностью.","reverse":false},{"id":"daily_agency.7","text":"Я путал «хочу» с «надо», когда выбирал дела.","reverse":false},{"id":"daily_agency.8","text":"Я считал, что день пропал, если одна задача не удалась.","reverse":false},{"id":"daily_agency.9","text":"Мне было полезно выбирать только одну важную задачу.","reverse":false},{"id":"daily_agency.10","text":"Я чувствовал давление необходимости быть постоянно продуктивным.","reverse":false},{"id":"daily_agency.11","text":"Я мог изменить цель, когда узнал о своих новых потребностях.","reverse":false},{"id":"daily_agency.12","text":"Я мог отложить неважное дело, не превращая это в личную неудачу.","reverse":false}]},{"id":"reflection_balance","title":"Рефлексия без зацикливания","kind":"reflection","group":"Мысли и реакции","period":"Последние две недели","questions":[{"id":"reflection_balance.1","text":"Я замечал, когда анализ события переставал давать новую информацию.","reverse":false},{"id":"reflection_balance.2","text":"Я возвращался к неприятной беседе вместо занятия текущими делами.","reverse":false},{"id":"reflection_balance.3","text":"Мне было сложно отличить планирование от повторения одних опасений.","reverse":false},{"id":"reflection_balance.4","text":"Я мог записать короткий вывод и завершить размышление.","reverse":false},{"id":"reflection_balance.5","text":"Я искал единственно правильное объяснение чужого поведения.","reverse":false},{"id":"reflection_balance.6","text":"Я думал, что обязан полностью разобраться в каждом чувстве.","reverse":false},{"id":"reflection_balance.7","text":"Я замечал, когда попытка объяснить эмоцию только усиливала напряжение.","reverse":false},{"id":"reflection_balance.8","text":"Мне помогало определить, что сейчас можно сделать на практике.","reverse":false},{"id":"reflection_balance.9","text":"Я мысленно спорил up":"VULNERABLE","emoji":"🍂"},{"id":"calm","title":"Спокойствие","group":"RESOURCES","emoji":"🌿"},{"id":"joy","title":"Радость","group":"RESOURCES","emoji":"☀️"},{"id":"curiosity","title":"Интерес","group":"RESOURCES","emoji":"🧩"},{"id":"hope","title":"Надежда","group":"RESOURCES","emoji":"✨"},{"id":"closeness","title":"Близость","group":"RESOURCES","emoji":"🤍"},{"id":"confidence","title":"Уверенность","group":"RESOURCES","emoji":"🪴"}],"stories":[{"id":"fox_anger","title":"Когда слова обжигают","subtitle":"Раздражение и выбор действия","narrative":"Лисичка Фи думает, что друг не слышит её. Голос становится громче, слова вот-вот превратятся в обидные. Медведь Бо удивлён. Фи вправе сердиться, но она может выбрать, как поступить с этим чувством.","why":"Гнев может сообщать о важной потребности или нарушенной границе. Он не даёт права унижать, угрожать или ломать вещи.","prompt":"Что Фи может сделать, чтобы не ранить друга?","smallPractice":"Назови чувство и безопасный предел: «Я злюсь из-за ... . Я не буду оскорблять. Сейчас мне нужна пауза».","reflection":"Что изменится, если признать гнев, но не позволять ему выбирать за тебя слова?","imageDescription":"Фиолетовая лисичка злится за столом, добрый медведь слушает рядом.","reactions":[{"text":"Сказать: «Я сейчас злюсь. Мне нужна пауза»","perspective":"Пауза помогает остановить нарастание ссоры и не перекладывает ответственность за гнев на Бо.","next":"Если безопасно, обозначить, когда можно попробовать поговорить снова."},{"text":"Выпалить всё, что накопилось","perspective":"После резких слов друг может почувствовать угрозу или боль. Сильное чувство объясняет реакцию, но не оправдывает вред.","next":"Снизить голос, прекратить спор и отойти; после паузы назвать конкретную проблему."},{"text":"Исчезнуть надолго, чтобы Бо понервничал","perspective":"Пауза ради безопасности и наказание молчанием — не одно и то же. Неопределённость может усиливать напряжение.","next":"Если это безопасно, сказать о необходимости перерыва без угроз и наказания."}]},{"id":"fox_pause","title":"Дождь за окном","subtitle":"Пауза, усталость и возвращение внимания","narrative":"Фи отошла от разговора. В голове ещё звучат неприятные фразы. Она замечает дождь, свет фонарей и тепло пледа. Ей необязательно немедленно стать спокойной, чтобы не продолжать ссору.","why":"Переключение на нейтральные ощущения может быть одной из доступных техник заземления. Оно не обязано сразу снижать напряжение и не заменяет решение проблемы.","prompt":"Как провести короткую паузу бережно?","smallPractice":"Если хочется, найди три цвета вокруг. Можно остановиться сразу или выбрать другой способ отдыха.","reflection":"По какому признаку ты поймёшь, что готов(а) продолжить безопасный разговор?","imageDescription":"Лисичка Фи спокойно сидит у дождливого окна с пледом.","reactions":[{"text":"Замечать формы и цвета вокруг","perspective":"Внешние ориентиры помогают временно вернуть внимание к настоящему. Нет необходимости следить за дыханием, если это неприятно.","next":"Найти глазами три нейтральных предмета и назвать их про себя."},{"text":"Заставить себя немедленно перестать злиться","perspective":"Чувства редко подчиняются приказу. Давление на себя может добавлять напряжение.","next":"Попробовать назвать состояние без оценки: «Сейчас мне трудно» и выбрать паузу."},{"text":"Снова и снова перечитывать обидные сообщения","perspective":"Повторное погружение в спор иногда поддерживает раздражение. Можно вернуться к вопросу позднее.","next":"Отложить экран ненадолго и проверить, что нужно телу: вода, отдых или движение."}]},{"id":"bird_sad","title":"Птичка, которой грустно","subtitle":"Как поддержать, не угадывая мысли","narrative":"Птенчик Пик сидит молча. Бо замечает, что он выглядит грустным, но не знает причины. Бо не может прочитать мысли Пика и не обязан сразу исправлять его настроение.","why":"Поддержка начинается с внимания и уважения к выбору человека: говорить, помолчать или попросить практическую помощь.","prompt":"Что Бо мог бы сказать?","smallPractice":"Попробуй два открытых вопроса без догадок: «Как ты?» и «Какая поддержка тебе сейчас удобна?».","reflection":"Как отличить заботу от попытки контролировать чужое настроение?","imageDescription":"Маленькая зелёная птичка грустит рядом с внимательным медведем.","reactions":[{"text":"«Я рядом. Хочешь поговорить или посидим молча?»","perspective":"Бо предлагает выбор и не объявляет, что точно знает переживания Пика.","next":"Выслушать ответ и уважать отказ от разговора."},{"text":"«Ты просто слишком много думаешь!»","perspective":"Даже добрые намерения могут звучать обесценивающе. Чувства другого не надо оспаривать.","next":"Можно спросить: «Как ты сейчас? Есть ли что-нибудь, чем помочь?»"},{"text":"Сразу рассказать Пику, что нужно делать","perspective":"Нежелательный совет может мешать чувствовать себя услышанным.","next":"Сперва уточнить, нужны ли советы, внимание или помощь с делом."}]},{"id":"bird_boundaries","title":"Право на тишину","subtitle":"Границы, согласие и уважение","narrative":"Пик говорит, что сейчас не хочет обсуждать переживания. Фи расстроена: ей хочется помочь и сразу узнать причину. Но отказ от разговора не означает, что Пик плохой друг.","why":"Право сказать «нет» сохраняется даже в близких отношениях. Нельзя заставить человека чувствовать благодарность за помощь.","prompt":"Как Фи уважить границу Пика?","smallPractice":"Составь фразу, уважающую отказ: «Я готов(а) помочь с ... , если тебе это нужно».","reflection":"Как можно одновременно проявлять заботу и не нарушать чужую свободу?","imageDescription":"Птичка Пик показывает крылом границу пространства; лисичка Фи внимательно слушает.","reactions":[{"text":"«Хорошо. Я рядом, если захочешь сам»","perspective":"Так Фи показывает готовность помочь, не давит и не угадывает чужие причины.","next":"Заняться своим делом и не требовать объяснений."},{"text":"Расспрашивать, пока Пик не сдастся","perspective":"Настойчивость может стать нарушением границы, даже когда человек беспокоится за друга.","next":"Сделать предложение один раз и оставить возможность ответить позже."},{"text":"Обидеться и объявить, что больше никогда не поможет","perspective":"Наказание за отказ может создавать страх и чувство долга.","next":"Различить собственное разочарование и право другого отказаться."}]},{"id":"fox_repair","title":"Разговор после ссоры","subtitle":"Ответственность и восстановление доверия","narrative":"Фи возвращается к Бо, когда оба готовы. Ей стыдно за резкий тон, но она понимает, что оправдание «ты меня довёл» только ранит сильнее. Бо вправе ещё расстраиваться.","why":"Ответственное извинение называет поступок и изменение поведения, но не требует прощения и не гарантирует восстановление отношений.","prompt":"Как Фи начать разговор?","smallPractice":"Сформулируй короткое извинение: поступок → признание вреда → что изменишь, без требования ответа.","reflection":"Как отличить исправление ошибки от попытки побыстрее избавиться от чувства вины?","imageDescription":"Лисичка и медведь спокойно разговаривают на скамейке в солнечном парке.","reactions":[{"text":"«Я повысила голос. Прости. В следующий раз возьму паузу»","perspective":"Фи признаёт собственный поступок, не обвиняя Бо. Тот может принять извинение или попросить время.","next":"Спросить, готов ли Бо обсудить конкретную ситуацию."},{"text":"«Прости, но ты сам виноват»","perspective":"Слово «но» здесь снимает ответственность за слова и переводит разговор в спор о виновности.","next":"Назвать свой поступок без оправдания и отдельно обсудить разные взгляды."},{"text":"Потребовать, чтобы Бо сразу простил","perspective":"Прощение нельзя получить давлением, даже после искреннего сожаления.","next":"Дать время и уважать решение другого человека."}]},{"id":"garden_together","title":"Маленький сад","subtitle":"Посильные добрые действия и надежда","narrative":"Друзья решили посадить маленький цветок. Это не отменило прежние переживания, но дало каждому возможность выбрать простое общее действие. Иногда сегодня достаточно совсем небольшого шага.","why":"Повседневная активность и связь с ценностями иногда поддерживают настроение. Важна посильность: можно выбрать отдых и не считать это поражением.","prompt":"Как сделать следующий шаг доступным для всех?","smallPractice":"Выбери одно бесплатное действие на 2 минуты: напоить растение, открыть окно или написать тёплое сообщение — только если хочется.","reflection":"Какое действие поддержит тебя и не станет новым требованием к себе?","imageDescription":"Лисичка Фи, медведь Бо и птичка Пик вместе ухаживают за цветком в саду.","reactions":[{"text":"Спросить, кто что хочет и может сделать","perspective":"Совместное действие строится на добровольности, возможностях и уважении к усталости.","next":"Выбрать один крошечный шаг на несколько минут."},{"text":"Раздать всем обязательные задачи","perspective":"Давление и сравнение могут испортить даже хорошую идею.","next":"Уточнить ресурсы и дать право отказаться."},{"text":"Отменить всё, ведь никто не чувствует себя идеально","perspective":"Не всегда требуется ждать идеального настроения, но и принуждать себя к активности не нужно.","next":"Выбрать отдых или очень маленькое дело, подходящее сейчас."}]}],"dialogs":[{"id":"argument","title":"Когда разговор накаляется","theme":"Гнев и пауза","emoji":"🔥","scenario":"Ты устал(а), близкий человек перебивает, а раздражение растёт.","closing":"Тебе не нужно запрещать себе гнев. Важно не превращать его в угрозы или унижение.","reflection":"Какие слова помогают поставить паузу, не наказывая молчанием?","moments":[{"context":"Собеседник перебил тебя во второй раз.","question":"Как ответить сейчас?","options":[{"text":"«Мне важно договорить. Я начинаю злиться»","perspective":"Это сообщает о потребности без нападения.","next":"Предложить дослушать друг друга по очереди."},{"text":"«Да ты никогда никого не слушаешь!»","perspective":"Обобщение может быстро усилить защитную реакцию.","next":"Назвать конкретное действие, которое задело."},{"text":"Ст <script>(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('tishe-data').textContent);
const MODULES=Object.fromEntries(DATA.modules.map(m=>[m.id,m]));
const QUESTIONS=Object.fromEntries(DATA.modules.flatMap(m=>m.questions.map(q=>[q.id,{...q,module:m.id}])));
const APP_VERSION='Web 0.2.4 • надёжное сохранение и единый компас';
const VAULT_KEY='tishe_web_v1_encrypted';
const A=['anxiety','anger','sadness','apathy','thoughts','stress'];
const NAMES={anxiety:'тревогой и беспокойством',anger:'раздражением и гневом',sadness:'грустью и подавленным настроением',apathy:'энергией и мотивацией',thoughts:'повторяющимися мыслями и проверками',stress:'стрессом и перегрузкой'};
const NEXT={anxiety:'Когда нарастает беспокойство, запиши тревожащую мысль и один посильный шаг.',anger:'При сильном раздражении сначала сделай безопасную паузу перед ответом.',sadness:'Выбери одного человека, с кем можно поговорить или просто побыть рядом.',apathy:'Выбери одно маленькое дело, которое не потребует много сил.',thoughts:'Замечай, когда начинаются повторные проверки; если они мешают жизни, обсуди это со специалистом.',stress:'Подумай, что сейчас можно отложить, упростить или разделить на части.'};
const COLORS={TENSION:'#efae99',VULNERABLE:'#c7b9eb',RESOURCES:'#9cdbc1'};
const LABELS={TENSION:'Напряжение',VULNERABLE:'Уязвимые чувства',RESOURCES:'Ресурсные чувства'};
const ROUTES={'40':'Начальный · 40','150':'Личный · 150','300':'Расширенный · 300','500':'Глубокий · 500'};
const ICONS={home:'⌂',tests:'◎',compass:'◈',practices:'✳',diary:'▤',stories:'✦',dialogs:'◌',support:'♡',settings:'⚙'};
const NAV=[['home','Главная'],['tests','Тесты'],['compass','Компас'],['practices','Практики'],['diary','Дневник'],['stories','Истории'],['dialogs','Диалоги'],['support','Поддержка'],['settings','Настройки']];
const PHQ_LABELS=['Совсем не беспокоило','Несколько дней','Более половины дней','Почти каждый день'];
const SCALE_LABELS=['Совсем нет','Редко','Иногда','Часто','Почти всегда'];
const clone=value=>typeof window.structuredClone==='function'?window.structuredClone(value):JSON.parse(JSON.stringify(value));
const now=()=>new Date().toLocaleString('ru-RU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const initial=()=>({version:1,answers:{},feelings:{},snapshots:[],diary:[],favorites:[],practicesDone:[],prefs:{autoNext:true,theme:'dark'},created:Date.now()});
let state=initial(),session='locked',key=null,salt=null,vault=null,storageOK=true,writeQueue=Promise.resolve(),activePage='home',isResetting=false,saveStatus='Защищено',isSaving=false;
let ui={route:'home',level:'40',module:'anxiety',idx:0,surveysGroup:'all',surveyTerm:'',practiceTerm:'',practiceFilter:'all',diaryTerm:'',diaryEdit:null,draft:'',story:null,storyPick:null,dialog:null,dialogStep:0,dialogPick:null,practice:null,unlockMode:'unlock',importPending:null,phqApproved:false,autoforward:null,mobileMore:false};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valid=(v,max=4)=>Number.isInteger(v)&&v>=0&&v<=max;
const getA=id=>valid(state.answers[id],id.startsWith('phq4.')?3:4)?state.answers[id]:null;
const pct=(a,b)=>b?Math.round(100*a/b):0;
const dateFmt=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const id=()=>((typeof window.crypto!=='undefined' && typeof window.crypto.randomUUID==='function')?window.crypto.randomUUID():('tishe_'+Date.now()+'_'+Math.random().toString(36).slice(2)));
function toast(text,err=false){const box=document.createElement('div');box.className='toast'+(err?' error':'');box.textContent=text;$('#toasts').append(box);setTimeout(()=>box.remove(),3800)}
function storage(){try{const k='__tishe_test__';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch{return false}}
function bytesBase64(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}
function base64Bytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function hasCrypto(){return !!(typeof window.crypto!=='undefined'&&window.crypto&&window.crypto.subtle&&typeof window.crypto.getRandomValues==='function')&&storageOK}
async function derive(pass,s){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:260000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptPayload(payload,cryptKey,s){const iv=crypto.getRandomValues(new Uint8Array(12));const bytes=new TextEncoder().encode(JSON.stringify(payload));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptKey,bytes);return {format:'TisheWebEncryptedBackup',version:1,created:Date.now(),salt:bytesBase64(s),iv:bytesBase64(iv),cipher:bytesBase64(new Uint8Array(cipher))}}
async function decryptPayload(meta,cryptKey){if(meta?.format!=='TisheWebEncryptedBackup'||meta.version!==1||!meta.salt||!meta.iv||!meta.cipher)throw new Error('Неверный формат защищённого хранилища');const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:base64Bytes(meta.iv)},cryptKey,base64Bytes(meta.cipher));return JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes))}
function normalizeState(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Неподдерживаемые данные');const result=initial();for(const k of ['answers','feelings','snapshots','diary','favorites','practicesDone','prefs'])if(k in raw)result[k]=raw[k];if(!result.answers||typeof result.answers!=='object'||Array.isArray(result.answers))throw Error('Неправильная карта ответов');if(!result.feelings||typeof result.feelings!=='object'||Array.isArray(result.feelings))throw Error('Неправильный компас');for(const [k,v] of Object.entries(result.answers))if(!QUESTIONS[k]||!valid(v,k.startsWith('phq4.')?3:4))delete result.answers[k];for(const [k,v] of Object.entries(result.feelings))if(!DATA.axes.some(x=>x.id===k)||!valid(v,5))delete result.feelings[k];if(!Array.isArray(result.snapshots)||!Array.isArray(result.diary)||!Array.isArray(result.favorites)||!Array.isArray(result.practicesDone))throw Error('Неверная структура данных');result.diary=result.diary.filter(d=>typeof d?.text==='string'&&d.text.length<=6000&&typeof d?.id==='string').slice(-2000);result.snapshots=result.snapshots.filter(d=>Number.isFinite(d?.ts)&&d?.feelings&&typeof d.feelings==='object').slice(-200);result.favorites=result.favorites.filter(x=>typeof x==='string').slice(-500);result.practicesDone=result.practicesDone.filter(x=>typeof x==='string').slice(-500);result.prefs={autoNext:result.prefs?.autoNext!==false,theme:result.prefs?.theme==='light'?'light':'dark'};return result}
function setSaveStatus(value){saveStatus=value;const el=document.getElementById('save-status');if(el)el.textContent=value}
function persist(){
 if(isResetting||session!=='vault'||!key||!salt)return Promise.resolve();
 const snapshot=clone(state),k=key,s=salt;
 isSaving=true;setSaveStatus('Сохранение…');
 const attempt=writeQueue.catch(()=>{}).then(async()=>{
  const payload=await encryptPayload(snapshot,k,s);
  localStorage.setItem(VAULT_KEY,JSON.stringify(payload));vault=payload;
 });
 writeQueue=attempt;
 attempt.then(()=>{if(writeQueue===attempt){isSaving=false;setSaveStatus('Сохранено')}})
 .catch(e=>{if(writeQueue===attempt){isSaving=false;setSaveStatus('Ошибка сохранения')}
  console.error('Save failed',e);toast('Не удалось записать зашифрованные данные. Не закрывай страницу; проверь свободное место и резервную копию.',true)});
 return attempt;
} async function makeVault(password){if(localStorage.getItem(VAULT_KEY))throw Error('Сохранённое пространство уже существует. Открой его или сделай резервную копию и удали данные перед созданием нового.');if(!hasCrypto())throw Error('Шифрование или локальное хранилище недоступно в этом браузере');if(password.length<8||password.length>200)throw Error('Пароль должен быть от 8 до 200 символов');
 const previous={session,key,salt,vault};
 try{salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(password,salt);session='vault';await persist()}
 catch(e){session=previous.session;key=previous.key;salt=previous.salt;vault=previous.vault;throw e}
 toast('Защищённое хранилище создано. Сохрани резервную копию.');render()}
async function unlockVault(password){if(!hasCrypto())throw Error('Невозможно открыть локальное защищённое хранилище');const m=JSON.parse(localStorage.getItem(VAULT_KEY)||'null');if(!m)throw Error('Хранилище не найдено');const s=base64Bytes(m.salt);const k=await derive(password,s);let payload;try{payload=await decryptPayload(m,k)}catch{throw Error('Пароль неверный или резервная копия повреждена')}state=normalizeState(payload);salt=s;key=k;session='vault';vault=m;saveStatus='Сохранено';render();toast('Защищённые данные открыты')}
function startDemo(){state=initial();session='demo';key=null;ui.route='home';render();toast('Демо: данные не сохраняются после закрытия страницы')}
function lockVault(){key=null;salt=null;state=initial();session='locked';ui.route='home';render()}
function exportVault(){if(session!=='vault'){toast('Сначала создай защищённое хранилище',true);return}persist().then(()=>{const saved=localStorage.getItem(VAULT_KEY);if(saved){download(new Blob([saved],{type:'application/json'}),'Tishe-encrypted-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('Зашифрованная резервная копия создана')}})}
function download(blob,filename){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},60000)}
function applyTheme(){document.documentElement.dataset.theme=state.prefs.theme}
function route(name,opts={}){if(ui.autoforward)clearTimeout(ui.autoforward);ui={...ui,...opts,route:name,autoforward:null,mobileMore:false};render();window.scrollTo(0,0)}
function consent(){if(session==='locked')return;ui.phqApproved=true;render()}
const totalAnswers=()=>Object.values(state.answers).filter(v=>valid(v)).length;
function answeredRoute(level,answers=state.answers){const q=DATA.routes[level];return q.reduce((sum,id)=>sum+(valid(answers[id])?1:0),0)}
function answeredModule(mod,answers=state.answers){return mod.questions.reduce((n,q)=>n+(valid(answers[q.id],mod.id==='phq4'?3:4)?1:0),0)}
function firstMissing(qids){return Math.max(0,qids.findIndex(id=>getA(id)===null))}
function openJourney(level){if(!DATA.routes[level])return;ui.level=level;ui.idx=firstMissing(DATA.routes[level]);const count=answeredRoute(level);route(count===DATA.routes[level].length?'report':'journey',{level,idx:ui.idx})}
function openModule(mid){const mod=MODULES[mid];if(!mod)return;ui.module=mid;ui.idx=Math.max(0,mod.questions.findIndex(q=>getA(q.id)===null));if(mid==='phq4'){ui.phqApproved=false;route('module',{module:mid,idx:ui.idx});return}route(answeredModule(mod)===mod.questions.length?'module-report':'module',{module:mid,idx:ui.idx})}
function setAnswer(qid,val){if(isResetting)return;const q=QUESTIONS[qid];if(!q||!valid(val,q.module==='phq4'?3:4))return;state.answers[qid]=val;persist()}
function setFeeling(fid,v){if(isResetting||!DATA.axes.some(a=>a.id===fid)||!valid(v,5))return;state.feelings[fid]=v;persist()}
function statFor(id,answers=state.answers,subset=null){const q=MODULES[id]?.questions.filter(x=>!subset||subset.includes(x.id))||[];const values=q.map(x=>answers[x.id]).filter(v=>valid(v));const required=Math.max(2,Math.ceil(q.length*.7));return {id,title:MODULES[id]?.title||id,count:values.length,total:q.length,ready:values.length>=required,avg:values.length>=required?values.reduce((a,b)=>a+b,0)/values.length:null,high:values.filter(v=>v>=3).length,sometimes:values.filter(v=>v===2).length,low:values.filter(v=>v<=1).length,items:q.filter(x=>valid(answers[x.id])&&answers[x.id]>=3).sort((a,b)=>answers[b.id]-answers[a.id])}}
function ipip(m,answers=state.answers){if(m.kind!=='ipip'||m.questions.some(q=>!valid(answers[q.id])))return null;return m.questions.reduce((n,q)=>n+(q.reverse?4-answers[q.id]:answers[q.id]),0)/m.questions.length}
function sentenceReport(level,answers=state.answers){const qids=DATA.routes[level];const actual=answeredRoute(level,answers);const stats=A.map(mid=>statFor(mid,answers,qids)).filter(x=>x.ready).sort((a,b)=>b.high-a.high||b.avg-a.avg);const big=stats.filter(x=>x.high>=3),med=stats.filter(x=>x.high>=2&&x.high<3),light=stats.filter(x=>x.high===1||(x.high===0&&x.sometimes>0));const selected=big.length?big:med.length?med:light;const focus=selected[0];const names=selected.slice(0,2).map(x=>NAMES[x.id]).join(' и ');
 const resources=MODULES.resources.questions.filter(q=>qids.includes(q.id)).filter(q=>valid(answers[q.id]));const resHigh=resources.filter(q=>answers[q.id]>=3);const values=MODULES.values.questions.filter(q=>qids.includes(q.id)&&valid(answers[q.id])&&answers[q.id]>=3);
 const rConcern=resources.length>=4&&resHigh.length>=3;const intro=actual===0?'Тест ещё не пройден':big.length?`По вашим ответам у вас часто возникают трудности с ${names}.`:med.length?`По вашим ответам есть заметные сложности с ${names}.`:light.length?`По вашим ответам есть отдельные сложности с ${names}.`:rConcern?'По вашим ответам есть заметные трудности с отдыхом и восстановлением.':stats.length===6?'По тесту вы не отметили частых трудностей в шести основных темах.':'Данных пока недостаточно для вывода по основным направлениям.';
 let because=focus?`В теме «${focus.title}» выбрано «часто» или «почти всегда» в ${focus.high} из ${focus.count} ответов.`:rConcern?`В вопросах об отдыхе и поддержке частые трудности отмечены в ${resHigh.length} из ${resources.length} ответов.`:'Текущие ответы не дают оснований выделить одну ведущую трудность.';
 const facts=selected.slice(0,3).map(s=>({title:s.title,n:s.high,total:s.count,quote:s.items.slice(0,2).map(x=>x.text)}));const extra=qids.filter(qid=>!A.includes(QUESTIONS[qid]?.module)&&!['resources','values'].includes(QUESTIONS[qid]?.module)&&!QUESTIONS[qid]?.module.startsWith('ipip_')&&valid(answers[qid])&&answers[qid]>=3).slice(0,4).map(qid=>QUESTIONS[qid].text);
 const step=focus?NEXT[focus.id]:rConcern?'Попробуй выбрать один доступный способ восстановления: меньше задач, пауза или поддержка.':'Если есть трудность, которая мешает повседневной жизни, помощь уместна независимо от результата теста.';

function reportPage(kind){if(kind==='module'){const mod=MODULES[ui.module],data=singleReport(mod),has=answeredModule(mod);if(!has)return `<div class="card">Ответов пока нет.</div>`;const name=data.head;return `${intro('Результаты опроса',E(mod.title),`${has}/${mod.questions.length} ответов · ${E(mod.period)}`)}<div class="question-shell"><section class="card report-hero"><span class="pill">Итог теста</span><div class="report-lead">${E(name)}</div><p>${E(data.because)}</p><div class="divider"></div><div class="micro">Что можно сделать</div><p class="mt8">${E(data.step)}</p></section>${data.texts.length?`<div class="card mt16"><h3>Какие ответы повлияли на итог</h3><ul class="bullet-list">${data.texts.map(t=>`<li>${E(t)}</li>`).join('')}</ul></div>`:''}<div class="card mt16"><h3>Все ответы по этой теме</h3><div class="scale-grid mt16">${mod.questions.map((q,i)=>`<div class="scale-row"><div class="scale-name">${i+1}. ${E(q.text)}</div><div class="scale-value font-number">${getA(q.id)===null?'—':`${getA(q.id)} / ${mod.id==='phq4'?3:4}`}</div>${progress(getA(q.id)??0,mod.id==='phq4'?3:4,'slim')}</div>`).join('')}</div></div><div class="callout mt16">${mod.id==='phq4'?'PHQ-4 — скрининг с опубликованными правилами подсчёта, но не диагноз. Русская версия здесь не проходила отдельную научную валидацию.':'Авторские опросы не прошли психометрическую валидацию. Итог описывает твои ответы, а не диагноз, норму или тип личности.'}</div><div class="btn-row mt20">${button('← К тестам','navigate',{attr:'data-to="tests"'})}<button class="btn btn-primary" data-action="review-module">Изменить ответы</button></div></div>`}
 const level=ui.level, demo=!!ui.demoReport;let answers=state.answers;if(demo){answers={};DATA.routes[level].forEach((qid,i)=>{answers[qid]=A.includes(QUESTIONS[qid].module)?([4,3,4,2,0,4][A.indexOf(QUESTIONS[qid].module)]===4?i%4===3?1:4:[4,3,4,2,0,4][A.indexOf(QUESTIONS[qid].module)]):i%5===0?4:2})}
 const r=sentenceReport(level,answers);const traits=r.ipip.map(m=>({title:m.title.replace('IPIP · ',''),value:m.score,id:m.id}));
 return `${intro('Итоги исследования',`Результаты · ${level} вопросов`,`${r.answered} из ${r.total} заполнено · ${demo?'демонстрационные ответы':'личные ответы'}`,button('← К тестам','navigate',{attr:'data-to="tests"'}))}<div class="card report-hero"><span class="pill">${demo?'ДЕМО-ПРИМЕР, не ваши результаты':'Итог теста'}</span><h2 class="report-lead">${E(r.head)}</h2><p>${E(r.because)}</p><div class="divider"></div><div class="micro">Что можно сделать дальше</div><p class="mt8">${E(r.step)}</p><div class="row between mt16"><span class="subtle">${r.ready?'Все вопросы заполнены':'Предварительный результат — пропуски не считаются нулями'}</span><span class="font-number">${r.answered}/${r.total}</span></div>${progress(r.answered,r.total,'slim')}</div>
${r.facts.length?`<div class="card mt16"><h3>Почему сделан такой вывод</h3><div class="grid2 mt12">${r.facts.map(f=>`<div class="card-soft"><strong>${E(f.title)}</strong><p class="subtle mt4">Частые отметки: ${f.n} из ${f.total}</p>${f.quote.map(t=>`<p class="small mt8">• ${E(t)}</p>`).join('')}</div>`).join('')}</div></div>`:''}
<div class="section-title"><h2>Единый компас: чувства и результаты</h2><span class="subtle">Одна наглядная карта</span></div>${unifiedCompassPanel(answers,true)}${r.ipip.length?`<div class="card mt16"><h3>Самоописание IPIP — отдельно</h3><p class="subtle mt8">Результаты не являются диагнозом или типом личности.</p>${chartRows(traits,4)}</div>`:''}${r.extra.length?`<div class="card mt16"><h3>Дополнительные наблюдения</h3><ul class="bullet-list">${r.extra.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`:''}

/** A single, honest multiring chart, never a combined clinical severity score. */
function unifiedCompassSVG(answers=state.answers){
 const outer=DATA.axes.map(a=>({...a,value:valid(state.feelings[a.id],5)?state.feelings[a.id]:null}));
 const inner=A.map(id=>{const st=statFor(id,answers,DATA.routes['40']);return {...st,title:MODULES[id].title,value:st.ready?st.avg:null}});
 const outerN=outer.filter(x=>x.value!==null).length,innerN=inner.filter(x=>x.value!==null).length;
 const cx=360,cy=338,outerR=198,innerR=92;
 const polar=(idx,n,dist)=>{let theta=-Math.PI/2+idx*Math.PI*2/n;return [cx+Math.cos(theta)*dist,cy+Math.sin(theta)*dist]};
 const coords=p=>p.map(x=>x.map(v=>v.toFixed(1)).join(',')).join(' ');
 const axes=outer.map((x,i)=>{let a=polar(i,18,outerR+34),end=polar(i,18,outerR),st=a[0]-cx;return `<line x1="${polar(i,18,outerR*.58).join('" y1="')}" x2="${end[0]}" y2="${end[1]}" stroke="var(--line)" stroke-width="1"/><text x="${a[0]}" y="${a[1]}" text-anchor="${st>14?'start':st< -14?'end':'middle'}" dominant-baseline="middle" fill="var(--text)" font-size="12"><title>${E(x.title)}: ${x.value===null?'нет отметки':x.value+'/5'}</title>${E(x.emoji+' '+(x.title.length>13?x.title.slice(0,12)+'…':x.title))}</text>`}).join('');
 const ring=[.25,.5,.75,1].map(t=>`<circle cx="${cx}" cy="${cy}" r="${(innerR+(outerR-innerR)*t).toFixed(1)}" fill="none" stroke="var(--line)" opacity=".48"/>`).join('');
 const innerGrid=[.5,1].map(t=>`<polygon points="${coords(inner.map((_,i)=>polar(i,6,innerR*.93*t)))}" stroke="#9cbfff" fill="none" opacity=".43"/>`).join('');
 const innerSpokes=inner.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${polar(i,6,innerR*.93)[0]}" y2="${polar(i,6,innerR*.93)[1]}" stroke="#a9bdf1" opacity=".55"/>`).join('');
 // Never connect nonconsecutive unanswered positions or infer zero from missing data.
 const outerPolygon=outerN===18?`<polygon points="${coords(outer.map((x,i)=>polar(i,18,innerR+14+(outerR-innerR-15)*x.value/5)))}" fill="#88e6c118" stroke="#8ae3c2" stroke-width="2.5"/>`:'';
 const outerDots=outer.map((x,i)=>{let [px,py]=polar(i,18,x.value===null?innerR+14:innerR+14+(outerR-innerR-15)*x.value/5);return `<circle cx="${px}" cy="${py}" r="${x.value===null?3:5.5}" fill="${x.value===null?'var(--panel2)':COLORS[x.group]}" stroke="${x.value===null?'var(--line)':COLORS[x.group]}" stroke-width="2"><title>${E(x.title)} — ${x.value===null?'не отмечено':x.value+'/5'}</title></circle>`}).join('');
 const innerPolygon=innerN===6?`<polygon points="${coords(inner.map((x,i)=>polar(i,6,innerR*.93*x.value/4)))}" fill="#a9bfff22" stroke="#b4caff" stroke-width="2.5"/>`:'';
 const innerDots=inner.map((x,i)=>{let [px,py]=polar(i,6,x.value===null?innerR*.95:innerR*.93*x.value/4);return `<circle cx="${px}" cy="${py}" r="${x.value===null?3:4.8}" fill="${x.value===null?'var(--panel2)':'#b4caff'}" stroke="#b4caff" stroke-width="1.5"><title>${E(x.title)} — ${x.value===null?'нет достаточно ответов':x.value.toFixed(1)+'/4'}</title></circle>`}).join('');
 const sectors=inner.map((x,i)=>{let p=polar(i,6,innerR+8);return `<text x="${p[0]}" y="${p[1]}" font-size="10" fill="#b8caff" text-anchor="middle"><title>${E(x.title)}</title>${i+1}</text>`}).join('');
 return `<svg viewBox="0 0 720 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Единый многослойный компас: 18 добровольных отметок чувств сейчас во внешнем кольце и шесть направлений теста из 40 вопросов во внутреннем. Незаданные значения не считаются нулём."><title>Единый компас чувств и ответов</title><circle cx="${cx}" cy="${cy}" r="${outerR+15}" fill="none" stroke="var(--line)"/>${ring}${axes}${outerPolygon}${outerDots}<circle cx="${cx}" cy="${cy}" r="${innerR+7}" fill="var(--panel2)" stroke="#b4caff" opacity=".96"/>${innerGrid}${innerSpokes}${innerPolygon}${innerDots}${sectors}<circle cx="${cx}" cy="${cy}" r="22" fill="var(--panel)" stroke="var(--accent)"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" fill="var(--accent)">Тише</text><text x="${cx}" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">18 чувств • сейчас</text><text x="${cx}" y="665" text-anchor="middle" font-size="13" fill="var(--muted)">Внутреннее кольцо: 6 тем по тесту • независимо от чувств</text></svg>`;
}
function unifiedCompassPanel(answers=state.answers,fromReport=false){
 const vals=DATA.axes.map(a=>({...a,value:valid(state.feelings[a.id],5)?state.feelings[a.id]:null}));
 const marked=vals.filter(a=>a.value!==null).length;
 const inner=A.map(id=>statFor(id,answers,DATA.routes['40']));
 const measured=inner.filter(r=>r.ready).length;
 const headline=sentenceReport('40',answers);
 const qa=answeredRoute('40',answers);
 return `<div class="super-layout"><section class="card"><div class="row between"><h3>Один большой компас</h3><span class="pill">${marked}/18 • ${measured}/6</span></div><div class="super-canvas mt12" tabindex="0" aria-label="Многослойный компас — на телефоне прокручивается по горизонтали">${unifiedCompassSVG(answers)}</div><p class="subtle mt8">На узком экране сдвигай диаграмму влево и вправо, чтобы прочитать подписи. Ниже доступны все значения текстом.</p><div class="super-legend"><span><i style="background:${COLORS.TENSION}"></i>Напряжение</span><span><i style="background:${COLORS.VULNERABLE}"></i>Уязвимые чувства</span><span><i style="background:${COLORS.RESOURCES}"></i>Ресурсные чувства</span><span><i style="background:#b4caff"></i>Ответы теста</span></div><p class="super-guide">Это одна карта с двумя отдельными измерениями. Снаружи — чувства, которые ты сам отмечаешь сейчас (0–5). В центре — шесть направлений из ответов теста (0–4). <strong>Один цвет не переводится в другой</strong>; пропуски не равны нулю.</p></section><aside class="card"><h3>Сводка большого компаса</h3><div class="super-stat"><div class="row between"><strong>Чувства прямо сейчас</strong><span class="super-pill">${marked} / 18</span></div><p class="subtle mt8">${marked?E(vals.filter(x=>x.value!==null).sort((a,b)=>b.value-a.value).slice(0,3).map(x=>x.title+': '+x.value+'/5').join(' · ')):'Отметь хотя бы одно чувство, чтобы увидеть его на внешнем кольце.'}</p></div><div class="super-stat"><div class="row between"><strong>Ответы теста</strong><span class="super-pill">${qa} / 40</span></div><p class="subtle mt8">${qa?E(headline.head):'Сначала ответь на вопросы, чтобы внутреннее кольцо получило реальные значения.'}</p></div><h3 class="mt16">Шесть внутренних направлений</h3>${inner.map((x,i)=>`<div class="super-stat"><div class="row between"><strong>${i+1}. ${E(x.title)}</strong><span class="font-number small">${x.ready?x.avg.toFixed(1)+'/4':'—'}</span></div>${progress(x.ready?x.avg:0,4,'slim')}</div>`).join('')}<div class="super-actions">${button(qa?'Открыть результат 40 вопросов':'Пройти 40 вопросов',qa?'open-journey':'open-journey',{small:true,attr:'data-level="40"'})}${!fromReport?button('Все опросы','navigate',{small:true,attr:'data-to="tests"'}):''}</div><p class="subtle mt12">По длинным тестам дополнительные темы и самоописание по-прежнему доступны в отчётах. Мы не сводим их к выдуманному общему баллу.</p></aside></div>`;
}

function practicesPage(){let set=new Set(PRACTICES.map(p=>p.tag));let list=PRACTICES.filter(p=>ui.practiceFilter==='all'||p.tag===ui.practiceFilter).filter(p=>`${p.title} ${p.tag} ${p.why}`.toLowerCase().includes(ui.practiceTerm.toLowerCase()));return `${intro('Небольшие шаги','Практики','Без обязательного дыхания, соревнования и оценивания результата. Выбирай удобный способ поддержки.')}

function storyPage(){const s=DATA.stories.find(s=>s.id===ui.story);if(!s)return storiesPage();const pick=ui.storyPick;return `${intro('Школа эмоций',E(s.title),E(s.subtitle),button('← Все истории','navigate',{attr:'data-to="stories"'}))}<div class="question-shell"><article class="card"><div class="story-picture" aria-hidden="true">${STORY_ICONS[s.id]||'✦'}</div><p style="line-height:1.75;font-size:16px">${E(s.narrative)}</p><div class="callout mt16">${E(s.why)}</div><h3 class="mt20">${E(s.prompt)}</h3>${s.reactions.map((x,i)=>`<button class="story-choice" data-action="story-choice" data-index="${i}" aria-pressed="${pick===i}">${E(x.text)}</button>`).join('')}${Number.isInteger(pick)&&s.reactions[pick]?`<div class="story-feedback"><strong>Как это может восприниматься</strong><p>${E(s.reactions[pick].perspective)}</p><strong style="display:block;margin-top:12px">Что дальше</strong><p>${E(s.reactions[pick].next)}</p></div>`:''}<div class="divider"></div><h3>Небольшая практика</h3><p class="muted mt8">${E(s.smallPractice)}</p><h3 class="mt20">Вопрос для размышления</h3><p class="muted mt8">${E(s.reflection)}</p><div class="btn-row mt20">${button('Другая история','navigate',{attr:'data-to="stories"'})}${button('Практики','navigate',{attr:'data-to="practices"'})}</div></article></div>`}
