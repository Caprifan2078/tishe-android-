name: Build Tishe v0.27 navigation safety QA APK
on:
  push:
    branches: [main, 'qa/**']
    paths:
      - 'project-source.b64'
      - 'scripts/PracticeSearchTest.kt'
      - 'scripts/PracticeSearchScreen.kt'
      - 'scripts/PracticeIndex.kt'
      - 'scripts/apply-v016.py'
      - 'scripts/apply-v017.py'
      - 'scripts/apply-v018.py'
      - 'scripts/apply-v019.py'
      - 'scripts/apply-v020.py'
      - 'scripts/apply-v021.py'
      - 'scripts/apply-v022.py'
      - 'scripts/apply-v023.py'
      - 'scripts/apply-v024.py'
      - 'scripts/apply-v025.py'
      - 'scripts/apply-v026.py'
      - 'scripts/apply-v027-navigation.py'
      - 'scripts/apply-qa-phq4-rotation.py'
      - 'scripts/apply-qa-assessment-durable.py'
      - 'scripts/apply-qa-assessment-offmain.py'
      - 'scripts/AssessmentOffMainUiTest.kt'
      - 'scripts/AssessmentDurableDiskSmokeTest.kt'
      - 'scripts/AssessmentResumePositionTest.kt'
      - 'scripts/AssessmentResultEntryPolicy.kt'
      - 'scripts/AssessmentResultEntryPolicy.kt'
      - 'scripts/AssessmentResultEntryPolicyTest.kt'
      - 'scripts/DirectTestConclusionEngine.kt'
      - 'scripts/DirectTestConclusionEngineTest.kt'
      - 'scripts/QuestionnaireNarrativeEngine.kt'
      - 'scripts/QuestionnaireNarrativeUi.kt'
      - 'scripts/QuestionnaireNarrativeEngineTest.kt'
      - 'scripts/JourneyReportEngine.kt'
      - 'scripts/JourneyReportUi.kt'
      - 'scripts/JourneyReportEngineTest.kt'
      - 'scripts/SuperCompassSignals.kt'
      - 'scripts/SuperCompassSignalsTest.kt'
      - 'scripts/SuperCompassOverview.kt'
      - 'scripts/AssessmentAnswerSummary.kt'
      - 'scripts/AssessmentAnswerSummaryTest.kt'
      - 'scripts/AssessmentResultsUi.kt'
      - 'scripts/DocumentTransactions.kt'
      - 'scripts/DocumentTransactionsTest.kt'
      - 'scripts/DiaryEditPolicy.kt'
      - 'scripts/DiaryEditPolicyTest.kt'
      - 'scripts/DiaryHistoryFilter.kt'
      - 'scripts/DiaryHistoryFilterTest.kt'
      - 'scripts/PracticeFavoritesPolicy.kt'
      - 'scripts/PracticeFavoritesPolicyTest.kt'
      - 'scripts/apply-redesign-v015.py'
      - '.github/workflows/build-preview-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore Tishe source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode project-source.b64 > /tmp/tishe-project.zip
          unzip -t /tmp/tishe-project.zip
          unzip -oq /tmp/tishe-project.zip -d .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
      - name: Apply clear start-screen redesign
        run: python3 scripts/apply-redesign-v015.py
      - name: Apply searchable practices update
        run: python3 scripts/apply-v016.py
      - name: Add encrypted favorites and navigation improvements
        run: python3 scripts/apply-v017.py
      - name: Add local diary search and filters
        run: python3 scripts/apply-v018.py
      - name: Add safe diary entry editing
        run: python3 scripts/apply-v019.py
      - name: Protect encrypted data with copy-on-write transactions
        run: python3 scripts/apply-v020.py
      - name: Calculate and show first 40 questionnaire scales
        run: python3 scripts/apply-v021.py
      - name: Integrate all feelings and explainable reflection themes
        run: python3 scripts/apply-v022.py
      - name: Explain outcomes of all questionnaires (40/150/300/500)
        run: python3 scripts/apply-v023.py
      - name: Explain evidence and limitations for every questionnaire
        run: python3 scripts/apply-v024.py
      - name: Show direct conclusions after every questionnaire
        run: python3 scripts/apply-v025.py
      - name: Reopen finished questionnaires at results and fix progress
        run: python3 scripts/apply-v026.py
      - name: Keep questionnaire and question position through Android rotation
        run: python3 scripts/apply-v027-navigation.py
      - name: Preserve PHQ-4 in-session acknowledgement across Activity recreation
        run: python3 scripts/apply-qa-phq4-rotation.py
      - name: Ensure durable questionnaire answers
        run: python3 scripts/apply-qa-assessment-durable.py
      - name: Move confirmed assessment IO off Android main thread
        run: python3 scripts/apply-qa-assessment-offmain.py
      - name: Make preview installable alongside older debug builds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = '    buildTypes {\n        release { isMinifyEnabled = false }\n    }'
          assert old in s, "Unknown Android Gradle buildTypes layout"
          s = s.replace(old, '    buildTypes {\n        debug { applicationIdSuffix = ".results27" }\n        release { isMinifyEnabled = false }\n    }', 1)
          p.write_text(s)
          m = Path("app/src/main/AndroidManifest.xml")
          manifest = m.read_text()
          assert 'android:name=".MainActivity"' in manifest
          m.write_text(manifest.replace('android:name=".MainActivity"', 'android:name="ru.tishe.app.MainActivity"').replace('android:label="Тише"', 'android:label="Тише (тест)"'))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "Preinstalled SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug Android APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
      - name: Run unit tests and lint
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug
      - name: Check APK metadata
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-metadata.txt
          grep -F "package: name='ru.tishe.app.results27'" apk-metadata.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tishe-Android-v027-results27-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tishe-build-diagnostics
          path: |
            build.log
            apk-metadata.txt
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
