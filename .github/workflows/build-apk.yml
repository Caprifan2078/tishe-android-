name: Build Tishe APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'source.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify project source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s source.zip
          unzip -t source.zip
          unzip -q -o source.zip -d .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Run unit tests and lint
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug
      - name: Check APK metadata
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-metadata.txt
          grep -F "package: name='ru.tishe.app'" apk-metadata.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tishe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tishe-build-reports
          path: |
            app/build/reports/
            apk-metadata.txt
          if-no-files-found: ignore
          retention-days: 14
